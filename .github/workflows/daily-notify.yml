name: Daily Kakao Schedule Notify

on:
  schedule:
    # 매일 09:30(KST) 발송 - KST는 UTC+9라 00:30 UTC로 지정한다.
    # 정각(00분)에 걸치지 않는 시각이라 GitHub Actions 스케줄 혼잡(정각에 전 세계 요청이 몰려
    # 큐가 밀리는 문제)도 함께 피한다.
    - cron: '30 0 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily notify endpoint
        run: |
          curl -sf -X POST "https://team-schedule-app-apd5.onrender.com/api/notify/daily" \
            -H "X-Notify-Key: ${{ secrets.KAKAO_NOTIFY_KEY }}" \
            --max-time 90 --retry 3 --retry-delay 15
