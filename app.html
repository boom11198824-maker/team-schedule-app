<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>팀 스케줄</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#14213d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="팀 스케줄" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/locales-all.global.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", Roboto, sans-serif;
  background: #f7f8fa;
  color: #14213d;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: white; border-bottom: 1px solid #e2e6ed;
  position: sticky; top: 0; z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-left h1 { font-size: 18px; margin: 0; color: #14213d; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-name { font-size: 14px; color: #4b5a78; font-weight: 600; }

.badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
.badge-on { background: #dcfce7; color: #166534; }
.badge-off { background: #fbe4e4; color: #b23a3a; }

main { padding: 20px; max-width: 1100px; margin: 0 auto; }
#calendar { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

.fab {
  position: fixed; right: 28px; bottom: 28px; padding: 14px 22px; border-radius: 999px;
  background: #ff6452; color: white; border: none; font-size: 15px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(255,100,82,0.4); cursor: pointer;
}
.fab:hover { background: #e5503f; }

button.btn-secondary, a.btn-secondary {
  background: #eef1f6; color: #4b5a78; border: 1px solid #e2e6ed; padding: 8px 14px;
  border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block;
}
button.btn-secondary:hover, a.btn-secondary:hover { background: #e2e6ed; }
button.btn-primary {
  background: #ff6452; color: white; border: none; padding: 10px 18px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.btn-primary:hover { background: #e5503f; }
button.btn-danger {
  background: #fbe4e4; color: #b23a3a; border: none; padding: 10px 18px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.btn-danger:hover { background: #f7d0d0; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
  align-items: center; justify-content: center; z-index: 100;
}
.modal-backdrop.hidden { display: none; }
.modal {
  background: white; border-radius: 14px; padding: 28px; width: 420px; max-width: 92vw;
  max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal h2 { margin-top: 0; font-size: 18px; }
.modal label { display: block; font-size: 13px; margin: 12px 0 4px; color: #4b5a78; }
.modal input, .modal textarea, .modal select {
  width: 100%; padding: 9px 11px; border: 1px solid #d7dce6; border-radius: 8px; font-size: 14px;
  font-family: inherit; background: white;
}
.modal input[readonly] { background: #f1f3f7; color: #6b7690; }
.field-note { font-size: 12px; color: #8993a6; margin: 4px 0 0; }
.detail-modal { width: 380px; }
.detail-header { margin-bottom: 4px; }
.detail-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px; color: white;
}
.detail-title { font-size: 19px; margin: 8px 0 18px; word-break: break-word; }
.detail-rows { display: flex; flex-direction: column; gap: 14px; }
.detail-row { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; color: #14213d; line-height: 1.5; }
.detail-icon { flex-shrink: 0; font-size: 16px; width: 20px; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 20px 10px; font-size: 12px; color: #8993a6; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
@media (max-width: 640px) { .legend { padding: 0 12px 10px; font-size: 11px; } }
.modal .row { display: flex; gap: 12px; }
.modal .row > div { flex: 1; }
.checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.checkbox-row input { width: auto; }
.modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
.spacer { flex: 1; }
.hidden { display: none !important; }

/* ---- 날짜 범위 선택 캘린더(range picker) ---- */
.range-picker {
  position: fixed; z-index: 200; width: 280px;
  background: white; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.22);
  border: 1px solid #e2e6ed; padding: 12px;
}
.rp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.rp-title { font-size: 14px; font-weight: 700; color: #14213d; }
.rp-nav {
  background: #eef1f6; border: none; border-radius: 6px; width: 26px; height: 26px;
  font-size: 15px; cursor: pointer; color: #4b5a78; line-height: 1;
}
.rp-nav:hover { background: #e2e6ed; }
.rp-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 2px; }
.rp-wd { font-size: 11px; color: #8993a6; padding: 4px 0; }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.rp-cell { height: 32px; }
.rp-day {
  display: flex; align-items: center; justify-content: center; font-size: 13px; color: #14213d;
  cursor: pointer; border-radius: 8px;
}
.rp-day:hover { background: #f1f3f7; }
.rp-today { font-weight: 700; color: #ff6452; }
.rp-in-range, .rp-in-range-preview { background: #ffe6e2; border-radius: 0; }
.rp-hover-end { background: #ffe6e2; border-radius: 0 8px 8px 0; }
.rp-start, .rp-end {
  background: #ff6452; color: white; font-weight: 700;
}
.rp-start:not(.rp-single) { border-radius: 8px 0 0 8px; }
.rp-end:not(.rp-single) { border-radius: 0 8px 8px 0; }
.rp-single { border-radius: 8px; }
.rp-hint { font-size: 12px; color: #8993a6; text-align: center; margin: 8px 0 0; }

.emp-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.emp-table th, .emp-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e2e6ed; }
.emp-table button { font-size: 12px; padding: 4px 8px; }

.fc-event { cursor: pointer; }
.fc-event-title, .fc-event-time { overflow: hidden; text-overflow: ellipsis; }
.fc-daygrid-event { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 4px; }
.fc-timegrid-event .fc-event-main { padding: 2px 4px; }

@media (max-width: 640px) {
  .topbar { padding: 10px 14px; gap: 8px; flex-wrap: wrap; }
  .topbar-left h1 { font-size: 16px; }
  .topbar-right { gap: 6px; }
  .topbar-right .user-name { display: none; }
  button.btn-secondary { padding: 7px 10px; font-size: 12px; }
  .badge { font-size: 11px; padding: 3px 8px; }

  main { padding: 12px; }
  #calendar { padding: 8px; }

  .fc-toolbar { flex-direction: column; gap: 8px; align-items: stretch !important; }
  .fc-toolbar-title { font-size: 16px !important; text-align: center; }
  .fc-toolbar-chunk { display: flex; justify-content: center; }
  .fc-button { padding: 5px 8px !important; font-size: 12px !important; }

  .fab {
    position: static; display: block; width: calc(100% - 24px);
    margin: 14px 12px 20px; border-radius: 10px; box-shadow: none;
    padding: 14px; font-size: 15px; text-align: center;
  }

  .modal { padding: 20px; width: 100%; border-radius: 14px 14px 0 0; overflow-x: auto; }
  .modal-backdrop { align-items: flex-end; }
  .modal .row { flex-direction: column; gap: 0; }
  .modal-actions { flex-wrap: wrap; }
  .modal-actions button { flex: 1 1 auto; }

  .emp-table { font-size: 12px; min-width: 480px; }
  .emp-table th, .emp-table td { padding: 6px 4px; white-space: nowrap; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>📅 팀 스케줄</h1>
      <span id="google-status" class="badge badge-off">구글 캘린더 미연동</span>
    </div>
    <div class="topbar-right">
      <a href="/cases.html" id="nav-cases" class="btn-secondary" style="text-decoration:none; display:inline-block;">⚖️ 사건관리</a>
      <a href="/consultations.html" id="nav-consultations" class="btn-secondary" style="text-decoration:none; display:inline-block;">🗂️ 상담관리</a>
      <a href="/clients.html" id="nav-clients" class="btn-secondary" style="text-decoration:none; display:inline-block;">📋 의뢰인 목록</a>
      <a href="/fee-calendar.html" id="nav-fee-calendar" class="btn-secondary" style="text-decoration:none; display:none;">💰 수임료 캘린더</a>
      <a href="/settings.html" id="nav-settings" class="btn-secondary" style="text-decoration:none; display:none;">⚙️ 설정</a>
      <button id="btn-employees" class="btn-secondary" style="display:none">직원 관리</button>
      <button id="btn-google" class="btn-secondary">구글 캘린더 연동</button>
      <span id="user-name" class="user-name"></span>
      <button id="btn-logout" class="btn-secondary">로그아웃</button>
    </div>
  </header>

  <main>
    <div id="calendar"></div>
    <div class="legend" id="category-legend"></div>
  </main>

  <button id="btn-new-schedule" class="fab">+ 일정 추가</button>

  <div id="detail-modal" class="modal-backdrop hidden">
    <div class="modal detail-modal">
      <div class="detail-header">
        <span id="detail-category-badge" class="detail-badge"></span>
      </div>
      <h2 id="detail-title" class="detail-title"></h2>
      <div class="detail-rows">
        <div class="detail-row">
          <span class="detail-icon">📅</span>
          <span id="detail-time"></span>
        </div>
        <div class="detail-row" id="detail-assignee-row">
          <span class="detail-icon">👤</span>
          <span id="detail-assignee"></span>
        </div>
        <div class="detail-row hidden" id="detail-location-row">
          <span class="detail-icon">📍</span>
          <span id="detail-location"></span>
        </div>
        <div class="detail-row hidden" id="detail-desc-row">
          <span class="detail-icon">📝</span>
          <span id="detail-desc"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-detail-delete" class="btn-danger hidden">삭제</button>

        <button type="button" class="btn-secondary" id="btn-detail-close">닫기</button>
        <button type="button" class="btn-primary hidden" id="btn-detail-edit">✏️ 수정</button>
      </div>
    </div>

  <div id="schedule-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="schedule-modal-title">일정 추가</h2>
      <form id="schedule-form">
        <input type="hidden" id="sch-id" />
        <label>제목 *</label>
        <input type="text" id="sch-title" required />

        <label>종류</label>
        <select id="sch-category">
          <option value="업무">📋 업무</option>
          <option value="보정">🔄 보정</option>
          <option value="상담">💬 상담</option>
          <option value="휴가">🌴 휴가</option>
          <option value="기타">📌 기타</option>
        </select>

        <div class="row" id="sch-date-range-wrap">
          <div>
            <label>시작일</label>
            <input type="text" class="date-field" id="sch-start" required readonly placeholder="yyyy-mm-dd" autocomplete="off" />
          </div>
          <div>
            <label>종료일</label>

  <div id="range-picker" class="range-picker hidden"></div>

        <div id="emp-tabs-row">
          <label style="display:block; font-size:13px; color:var(--text-secondary); margin:8px 0 4px;">접근 가능한 탭 (관리자는 항상 전체 접근)</label>
          <label class="checkbox-row"><input type="checkbox" class="emp-tab-checkbox" value="cases" checked /> ⚖️ 사건관리</label>

          <label class="checkbox-row"><input type="checkbox" class="emp-tab-checkbox" value="clients" checked /> 📋 의뢰인 목록</label>

          <div class="spacer"></div>

        <button type="button" class="btn-secondary" id="btn-close-google">닫기</button>
        <button type="button" class="btn-danger hidden" id="btn-disconnect-google">연동 해제</button>
        <button type="button" class="btn-primary" id="btn-connect-google">구글 계정 연결하기</button>
      </div>

<script>
let currentUser = null;
let calendar = null;

const CATEGORY_META = {
  '업무': { icon: '📋', color: '#14213d' },
  '보정': { icon: '🔄', color: '#d99a06' },
  '상담': { icon: '💬', color: '#8b5cf6' },
  '휴가': { icon: '🌴', color: '#ef4444' },
  '기타': { icon: '📌', color: '#8993a6' },
};

function renderCategoryLegend() {
  const el = document.getElementById('category-legend');
  el.innerHTML = Object.entries(CATEGORY_META)
    .map(([name, meta]) => `<span><i style="background:${meta.color}"></i>${meta.icon} ${name}</span>`)
    .join('');
}

function pad(n) { return String(n).padStart(2, '0'); }
// 일정은 시/분/초 없이 날짜(yyyy-mm-dd) 단위로만 관리한다.
// start_at/end_at은 우리 쪽 저장 규칙상 둘 다 '포함(inclusive)' 날짜 — 즉 end_at도 마지막 날 자체를 가리킨다.
function dateOnly(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.slice(0, 10).split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
}
function daysBetween(aStr, bStr) {
  const a = new Date(aStr + 'T00:00:00Z');
  const b = new Date(bStr + 'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}

/* ---- 날짜칸: 브라우저/OS 로케일에 상관없이 항상 yyyy-mm-dd로 고정 ---- */
function isValidDateStr(s) {
  return /^\d{4}-\d{2}-\d{2}$/.test(s || '');
}
function maskDateInput(el) {
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g, '').slice(0, 8);
    let out = digits;
    if (digits.length > 4) out = digits.slice(0, 4) + '-' + digits.slice(4);
    if (digits.length > 6) out = digits.slice(0, 4) + '-' + digits.slice(4, 6) + '-' + digits.slice(6);
    el.value = out;
  });
}
document.querySelectorAll('input.date-field').forEach(maskDateInput);

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (res.status === 401) { window.location.href = '/'; throw new Error('로그인이 필요합니다.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}

// 탭별 접근권한 체크. 관리자는 항상 true. allowed_tabs가 null/undefined(미설정)이면
// 기존 직원 계정과 동일하게 전체 허용 — 이 기능이 추가되기 전 계정의 접근 범위가
// 갑자기 좁아지지 않도록 하기 위함이다.
function hasTab(user, tab) {
  if (!user) return false;
  if (user.role === 'admin') return true;
  if (user.allowed_tabs === null || user.allowed_tabs === undefined) return true;
  return String(user.allowed_tabs).split(',').map((s) => s.trim()).filter(Boolean).includes(tab);
}

async function init() {
  try {
    currentUser = await api('/api/auth/me');
  } catch {
    window.location.href = '/';
    return;
  }

  document.getElementById('user-name').textContent = `${currentUser.name} 님`;
  if (currentUser.role === 'admin') {
    document.getElementById('btn-employees').style.display = 'inline-block';
    document.getElementById('nav-settings').style.display = 'inline-block';
  }
  if (!hasTab(currentUser, 'cases')) document.getElementById('nav-cases').style.display = 'none';
  if (!hasTab(currentUser, 'consultations')) document.getElementById('nav-consultations').style.display = 'none';
  if (!hasTab(currentUser, 'clients')) document.getElementById('nav-clients').style.display = 'none';
  if (hasTab(currentUser, 'fee')) document.getElementById('nav-fee-calendar').style.display = 'inline-block';

  renderCategoryLegend();
  setupCalendar();
  refreshGoogleStatus();

  const params = new URLSearchParams(window.location.search);
  if (params.get('google') === 'connected') {
    alert('구글 캘린더 연동이 완료되었습니다!');
    window.history.replaceState({}, '', '/app.html');
  }
  // 설정 페이지 등 다른 화면에서 "여기서 관리하기" 버튼으로 넘어온 경우 해당 모달을 바로 열어준다.
  if (params.get('open') === 'employees' && currentUser.role === 'admin') {
    document.getElementById('btn-employees').click();
    window.history.replaceState({}, '', '/app.html');
  } else if (params.get('open') === 'google') {
    document.getElementById('btn-google').click();

// 사건관리(case_tasks: 서류/보정 제출기한)를 팀 스케줄 달력에 함께 보여주기 위한 표시 규칙.
// 이 항목들은 schedules 테이블이 아니라 case_tasks가 원본이므로(OSMU) 여기서 새로 만들지 않고
// 읽기 전용으로 표시만 하고, 클릭하면 수정은 사건상세 페이지에서 하도록 안내한다.
function caseTaskEventColor(task, dDay) {
  if (task.status === '완료') return '#1e8e5a';
  if (dDay < 0) return '#d6394a';
  if (dDay === 0) return '#d6394a';
  if (dDay <= 3) return '#d99a06';
  return '#2563eb';
}
function caseTaskEventIcon(task, dDay) {
  if (task.status === '완료') return '✅';
  if (dDay < 0) return '⛔';
  if (dDay === 0) return '🔴';
  if (dDay <= 3) return '🟡';
  return '🔵';
}

function setupCalendar() {
  const el = document.getElementById('calendar');
  const isMobile = window.innerWidth < 768;
  calendar = new FullCalendar.Calendar(el, {
    locale: 'ko',
    height: 'auto',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'listDay,listWeek,dayGridMonth' },
    buttonText: { today: '오늘', month: '월', week: '주', day: '일' },
    initialView: isMobile ? 'listDay' : 'dayGridMonth',
    eventDisplay: 'block',
    nowIndicator: true,
    dayMaxEvents: true,
    selectable: true,
    events: async (info, success, failure) => {
      try {
        const [rows, tasks] = await Promise.all([
          api(`/api/schedules?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`),
          api(`/api/case-tasks?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`),
        ]);
        const scheduleEvents = rows.map((r) => {
          const meta = CATEGORY_META[r.category] || CATEGORY_META['업무'];
          const namePart = r.assignee_name ? `[${r.assignee_name}] ` : '';
          return {
            id: `s-${r.id}`,
            title: `${meta.icon} ${namePart}${r.title}`,
            start: r.start_at.slice(0, 10),
            end: addDays(r.end_at, 1), // FullCalendar는 종료일을 배타적(exclusive)으로 취급하므로 하루 더해준다
            allDay: true,
            backgroundColor: meta.color,
            borderColor: meta.color,
            extendedProps: Object.assign({ _source: 'schedule' }, r),
          };
        });
        const todayStr = dateOnly(new Date());
        const taskEvents = tasks.map((t) => {
          const dDay = daysBetween(todayStr, t.due_date.slice(0, 10));
          const color = caseTaskEventColor(t, dDay);
          const icon = caseTaskEventIcon(t, dDay);
          const namePart = t.client_name ? `[${t.client_name}] ` : '';
          return {
            id: `t-${t.id}`,
            title: `${icon} ${namePart}${t.task_type}`,
            start: t.due_date.slice(0, 10),
            end: addDays(t.due_date, 1),
            allDay: true,
            backgroundColor: color,
            borderColor: color,
            extendedProps: Object.assign({ _source: 'case_task' }, t),
          };
        });
        success(scheduleEvents.concat(taskEvents));
      } catch (err) { failure(err); }
    },
    select: (info) => {
      const startStr = dateOnly(info.start);
      const endExclusive = dateOnly(info.end);
      const endStr = addDays(endExclusive, -1);
      openScheduleModal({ startStr, endStr: endStr >= startStr ? endStr : startStr });
    },
    eventClick: (info) => {
      const props = info.event.extendedProps;
      if (props._source === 'case_task') {
        window.location.href = `/case-detail.html?id=${props.case_id}&from=cases`;
        return;
      }
      openDetailModal(props);
    },
  });
  calendar.render();
}

/* ---- 날짜 범위 선택 캘린더 (시작일 클릭 → 달력이 열리고, 시작일/종료일을 한 달력에서
   연속으로 선택. Google Calendar/Booking.com/Airbnb 스타일) ---- */
const schStartInput = document.getElementById('sch-start');
const schEndInput = document.getElementById('sch-end');
const rangePickerEl = document.getElementById('range-picker');
const RANGE_WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const rangePicker = { open: false, viewYear: 0, viewMonth: 0, start: null, end: null, mode: 'start', hover: null };

function rpFmt(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function rpParse(s) {
  if (!isValidDateStr(s)) return null;
  const [y, m, d] = s.split('-').map(Number);
  return { y, m: m - 1, d };
}

function closeRangePicker() {
  rangePicker.open = false;
  rangePickerEl.classList.add('hidden');
  document.removeEventListener('mousedown', rangePickerOutsideHandler, true);
}

function rangePickerOutsideHandler(e) {
  if (rangePickerEl.contains(e.target) || e.target === schStartInput || e.target === schEndInput) return;
  closeRangePicker();
}

// 달력 높이를 화면에 그린 뒤 재서, 아래쪽 공간이 부족하면(모달의 취소/저장 버튼과
// 겹치는 것을 방지) 입력창 위쪽으로 뒤집어서 띄운다. 월 이동으로 주(row) 수가
// 바뀌어 높이가 달라질 수 있으므로 렌더링될 때마다 다시 계산한다.
function rpReposition() {
  const rect = document.getElementById('sch-date-range-wrap').getBoundingClientRect();
  const pickerHeight = rangePickerEl.offsetHeight;
  // 아래로 펼쳤을 때 부딪히는 기준선을 뷰포트 하단이 아니라 모달의 "취소/저장" 버튼 줄
  // 상단으로 잡는다 (그래야 달력이 그 버튼들을 가려버리는 것을 막을 수 있다).
  const actionsRow = document.querySelector('#schedule-modal .modal-actions');
  const floorY = Math.min(actionsRow ? actionsRow.getBoundingClientRect().top : window.innerHeight, window.innerHeight);
  const spaceBelow = floorY - rect.bottom;
  // 아래쪽에 다 들어가지 않으면 위로 띄운다. 위쪽 공간도 부족하면(작은 화면 등)
  // 뷰포트 상단에서 8px 여백을 두고 클리핑하는데, 그래도 "취소/저장" 버튼 줄보다는
  // 항상 위쪽에 오므로 중요한 액션 버튼을 가리는 것만큼은 항상 피할 수 있다.
  const openUpward = spaceBelow < pickerHeight + 12;
  if (openUpward) {
    // 위로 띄우되, 모달/뷰포트 위쪽으로 잘리지 않도록 최소 8px 여백은 유지한다.
    const top = Math.max(8, rect.top - pickerHeight - 6);
    rangePickerEl.style.top = `${top}px`;
  } else {
    rangePickerEl.style.top = `${rect.bottom + 6}px`;
  }
  rangePickerEl.style.left = `${rect.left}px`;
}

function openRangePicker() {
  const startVal = schStartInput.value;
  const endVal = schEndInput.value;
  const sp = rpParse(startVal);
  const ep = rpParse(endVal);

  rangePicker.start = sp ? startVal : null;
  rangePicker.end = ep ? endVal : null;
  rangePicker.mode = 'start';
  rangePicker.hover = null;
  if (sp) { rangePicker.viewYear = sp.y; rangePicker.viewMonth = sp.m; }
  else { const t = new Date(); rangePicker.viewYear = t.getFullYear(); rangePicker.viewMonth = t.getMonth(); }

  rangePicker.open = true;
  renderRangePicker();

  rangePickerEl.classList.remove('hidden');
  rpReposition();

  document.addEventListener('mousedown', rangePickerOutsideHandler, true);
}

function rpShiftMonth(delta) {
  let m = rangePicker.viewMonth + delta;
  let y = rangePicker.viewYear;
  if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
  rangePicker.viewMonth = m;
  rangePicker.viewYear = y;
  renderRangePicker();
  rpReposition();
}

function rpPick(dateStr) {
  if (rangePicker.mode === 'start') {
    rangePicker.start = dateStr;
    rangePicker.end = null;
    rangePicker.mode = 'end';
    rangePicker.hover = null;
    renderRangePicker();
    return;
  }
  // mode === 'end' — 시작일보다 이전 날짜를 고르면 그 날짜를 새 시작일로 다시 잡는다
  // (Airbnb 등과 동일하게, 에러를 띄우는 대신 자연스럽게 재선택되도록 함)
  if (dateStr < rangePicker.start) {
    rangePicker.start = dateStr;
    rangePicker.end = null;
    rangePicker.hover = null;
    renderRangePicker();
    return;
  }
  rangePicker.end = dateStr;
  schStartInput.value = rangePicker.start;
  schEndInput.value = rangePicker.end;
  closeRangePicker();
}

// 날짜 하나에 대한 클래스 목록을 계산한다. 렌더링과 호버 갱신에서 공통으로 사용한다.
function rpCellClasses(ds, todayStr) {
  const { start, end, mode, hover } = rangePicker;
  const classes = ['rp-day'];
  if (ds === todayStr) classes.push('rp-today');
  const previewEnd = mode === 'end' && start && hover ? hover : null;
  const inRange = (start && end && ds > start && ds < end) || (previewEnd && ds > start && ds < previewEnd);
  if (inRange) classes.push('rp-in-range');
  if (previewEnd && ds === previewEnd && ds !== start) classes.push('rp-hover-end');
  if (start && ds === start) classes.push('rp-start');
  if (end && ds === end) classes.push('rp-end');
  if (start && end && start === end && ds === start) classes.push('rp-single');
  return classes.join(' ');
}

// 마우스 호버 미리보기는 그리드를 다시 그리지 않고, 이미 존재하는 셀들의 class만 갱신한다.
// innerHTML을 매번 새로 그리면 마우스가 셀 위를 지나갈 때마다 DOM 노드가 교체되어
// 클릭 대상이 화면에서 떨어져 나가(detach) 클릭이 씹히는 문제가 있었다.
function rpUpdateHoverClasses() {
  const todayStr = dateOnly(new Date());
  rangePickerEl.querySelectorAll('.rp-day').forEach((el) => {
    el.className = rpCellClasses(el.dataset.date, todayStr);
  });
}

function renderRangePicker() {
  const { viewYear, viewMonth, mode } = rangePicker;
  const first = new Date(viewYear, viewMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const todayStr = dateOnly(new Date());

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="rp-cell"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = rpFmt(viewYear, viewMonth, d);
    cells += `<div class="rp-cell"><div class="${rpCellClasses(ds, todayStr)}" data-date="${ds}">${d}</div></div>`;
  }

  rangePickerEl.innerHTML = `
    <div class="rp-header">
      <button type="button" class="rp-nav" id="rp-prev">‹</button>
      <span class="rp-title">${viewYear}년 ${viewMonth + 1}월</span>
      <button type="button" class="rp-nav" id="rp-next">›</button>
    </div>
    <div class="rp-weekdays">${RANGE_WEEKDAYS.map((w) => `<div class="rp-wd">${w}</div>`).join('')}</div>
    <div class="rp-grid">${cells}</div>
    <p class="rp-hint">${mode === 'start' ? '시작일을 선택하세요' : '종료일을 선택하세요 (하루 일정이면 같은 날짜 선택)'}</p>
  `;

  document.getElementById('rp-prev').addEventListener('click', () => rpShiftMonth(-1));
  document.getElementById('rp-next').addEventListener('click', () => rpShiftMonth(1));
  rangePickerEl.querySelectorAll('.rp-day').forEach((el) => {
    el.addEventListener('click', () => rpPick(el.dataset.date));
    el.addEventListener('mouseenter', () => {
      if (rangePicker.mode === 'end' && rangePicker.start) { rangePicker.hover = el.dataset.date; rpUpdateHoverClasses(); }
    });
  });
}

schStartInput.addEventListener('click', () => openRangePicker());
schEndInput.addEventListener('click', () => openRangePicker());

/* ---- 일정 상세보기 (구글 캘린더 스타일: 탭하면 먼저 미리보기, 수정은 별도 버튼) ---- */

const detailModal = document.getElementById('detail-modal');
let detailExisting = null;

const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];

// 한국은 DST가 없으므로 UTC+9 로 고정 계산 (기기의 로컬 타임존 설정과 무관하게 항상 정확한 한국 시간 표시)
function toSeoulParts(d) {
  const s = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  return {
    year: s.getUTCFullYear(), month: s.getUTCMonth() + 1, day: s.getUTCDate(),
    weekday: s.getUTCDay(), hour: s.getUTCHours(), minute: s.getUTCMinutes(),
  };
}
function formatDetailDate(d) {
  const p = toSeoulParts(d);
  return `${p.year}년 ${p.month}월 ${p.day}일 (${WEEKDAY_KO[p.weekday]})`;
}
function isSameDay(a, b) {
  const pa = toSeoulParts(a);
  const pb = toSeoulParts(b);
  return pa.year === pb.year && pa.month === pb.month && pa.day === pb.day;
}

// 모든 일정은 시/분/초 없이 날짜 단위로만 관리하므로 항상 날짜(구간)만 표시한다.
function formatDetailDateTime(existing) {
  const start = new Date(existing.start_at);
  const end = new Date(existing.end_at);
  return isSameDay(start, end)
    ? formatDetailDate(start)
    : `${formatDetailDate(start)} ~ ${formatDetailDate(end)}`;
}

function openDetailModal(existing) {
  detailExisting = existing;
  const meta = CATEGORY_META[existing.category] || CATEGORY_META['업무'];

  document.getElementById('detail-time').textContent = formatDetailDateTime(existing);

  const assigneeRow = document.getElementById('detail-assignee-row');
  if (existing.assignee_name) {
    assigneeRow.classList.remove('hidden');
    document.getElementById('detail-assignee').textContent = existing.assignee_name;
  } else {
    assigneeRow.classList.add('hidden');
  }

  const locationRow = document.getElementById('detail-location-row');
  if (existing.location) {
    locationRow.classList.remove('hidden');
    document.getElementById('detail-location').textContent = existing.location;
  } else {
    locationRow.classList.add('hidden');
  }

  const descRow = document.getElementById('detail-desc-row');
  if (existing.description) {
    descRow.classList.remove('hidden');
    document.getElementById('detail-desc').textContent = existing.description;
  } else {
    descRow.classList.add('hidden');
  }

  const canModify = currentUser.role === 'admin' || existing.created_by === currentUser.id;
  document.getElementById('btn-detail-edit').classList.toggle('hidden', !canModify);
  document.getElementById('btn-detail-delete').classList.toggle('hidden', !canModify);

  detailModal.classList.remove('hidden');
}

const TAB_LABELS = { cases: '⚖️ 사건관리', consultations: '🗂️ 상담관리', clients: '📋 의뢰인 목록', fee: '💰 수임료 캘린더' };

function tabSummaryText(emp) {
  if (emp.role === 'admin') return '전체(관리자)';
  if (emp.allowed_tabs === null || emp.allowed_tabs === undefined) return '전체';
  const keys = String(emp.allowed_tabs).split(',').map((s) => s.trim()).filter(Boolean);
  if (!keys.length) return '(없음 — 팀 스케줄만)';
  return keys.map((k) => TAB_LABELS[k] || k).join(', ');
}

async function loadEmployees() {
  const rows = await api('/api/employees');
  const tbody = document.getElementById('emp-tbody');
  tbody.innerHTML = '';
  rows.forEach((emp) => {
    const tr = document.createElement('tr');
    const currentTabs = new Set(
      emp.allowed_tabs === null || emp.allowed_tabs === undefined
        ? Object.keys(TAB_LABELS)
        : String(emp.allowed_tabs).split(',').map((s) => s.trim()).filter(Boolean)
    );
    const editCheckboxes = Object.entries(TAB_LABELS)
      .map(([key, label]) => `<label class="checkbox-row"><input type="checkbox" class="edit-tab-checkbox" value="${key}" ${currentTabs.has(key) ? 'checked' : ''} /> ${label}</label>`)
      .join('');
    tr.innerHTML = `
      <td>${emp.name}</td>
      <td>${emp.username}</td>
      <td>${emp.email || ''}</td>
      <td>${emp.role === 'admin' ? '관리자' : '직원'}</td>
      <td>
        <span class="tab-summary">${tabSummaryText(emp)}</span>
        <div class="tab-edit-box hidden" style="margin-top:6px;">${editCheckboxes}<button type="button" class="btn-secondary btn-save-tabs" style="margin-top:4px;">저장</button></div>
      </td>
      <td>
        ${emp.role === 'admin' ? '' : `<button data-id="${emp.id}" class="btn-secondary btn-edit-tabs">권한 수정</button>`}
        ${emp.id === currentUser.id ? '' : `<button data-id="${emp.id}" class="btn-secondary btn-delete-emp">삭제</button>`}
      </td>
    `;
    tbody.appendChild(tr);

    if (emp.role !== 'admin') {
      const editBox = tr.querySelector('.tab-edit-box');
      tr.querySelector('.btn-edit-tabs').addEventListener('click', () => editBox.classList.toggle('hidden'));
      tr.querySelector('.btn-save-tabs').addEventListener('click', async () => {
        const selected = Array.from(tr.querySelectorAll('.edit-tab-checkbox:checked')).map((cb) => cb.value);
        await api(`/api/employees/${emp.id}`, { method: 'PATCH', body: JSON.stringify({ allowed_tabs: selected }) });
        loadEmployees();
      });
    }
  });
  tbody.querySelectorAll('.btn-delete-emp').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 직원 계정을 삭제할까요?')) return;
      await api(`/api/employees/${btn.dataset.id}`, { method: 'DELETE' });
      loadEmployees();
    });
  });
}

document.getElementById('btn-employees').addEventListener('click', () => {
  employeesModal.classList.remove('hidden');
  loadEmployees();
});
document.getElementById('btn-close-employees').addEventListener('click', () => employeesModal.classList.add('hidden'));

document.getElementById('emp-admin').addEventListener('change', (e) => {
  document.getElementById('emp-tabs-row').style.display = e.target.checked ? 'none' : 'block';
});

document.getElementById('emp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const isAdmin = document.getElementById('emp-admin').checked;
  const payload = {
    name: document.getElementById('emp-name').value.trim(),
    username: document.getElementById('emp-username').value.trim(),
    email: document.getElementById('emp-email').value.trim(),
    password: document.getElementById('emp-password').value,
    role: isAdmin ? 'admin' : 'employee',
    allowed_tabs: isAdmin ? [] : Array.from(document.querySelectorAll('.emp-tab-checkbox:checked')).map((cb) => cb.value),
  };
  try {
    await api('/api/employees', { method: 'POST', body: JSON.stringify(payload) });
    document.getElementById('emp-form').reset();
    document.getElementById('emp-tabs-row').style.display = 'block';
    document.querySelectorAll('.emp-tab-checkbox').forEach((cb) => { cb.checked = true; });
    document.getElementById('emp-error').textContent = '';
    loadEmployees();
  } catch (err) {
    document.getElementById('emp-error').textContent = err.message;
  }
});

const googleModal = document.getElementById('google-modal');

document.getElementById('btn-google').addEventListener('click', async () => {
  const status = await refreshGoogleStatus();
  const desc = document.getElementById('google-modal-desc');
  const disconnectBtn = document.getElementById('btn-disconnect-google');
  const connectBtn = document.getElementById('btn-connect-google');

  if (status.connected) {
    desc.textContent = `현재 "${status.calendarSummary}" 캘린더에 일정이 자동으로 동기화되고 있습니다.`;
    disconnectBtn.classList.remove('hidden');
    connectBtn.textContent = '다시 연결하기';
  } else {
    desc.textContent = currentUser.role === 'admin'
      ? '관리자 구글 계정을 연결하면, 이후 모든 일정이 회사 공용 캘린더에 자동으로 기재됩니다.'
      : '아직 구글 캘린더가 연동되지 않았습니다. 관리자에게 연동을 요청해주세요.';
    disconnectBtn.classList.add('hidden');
    connectBtn.textContent = '구글 계정 연결하기';
  }
  connectBtn.style.display = currentUser.role === 'admin' ? 'inline-block' : 'none';
  googleModal.classList.remove('hidden');
});

document.getElementById('btn-close-google').addEventListener('click', () => googleModal.classList.add('hidden'));

document.getElementById('btn-connect-google').addEventListener('click', async () => {
  try {
    const { url } = await api('/api/google/auth-url');
    window.location.href = url;
  } catch (err) {
    alert(err.message);
  }
});

document.getElementById('btn-disconnect-google').addEventListener('click', async () => {
  if (!confirm('구글 캘린더 연동을 해제할까요? 기존에 등록된 이벤트는 구글 캘린더에 남아있지만 더 이상 동기화되지 않습니다.')) return;
  await api('/api/google/disconnect', { method: 'POST' });
  refreshGoogleStatus();
  googleModal.classList.add('hidden');
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST' });
  window.location.href = '/';
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}

init();
</script>
</body>
</html>
