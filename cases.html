<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>사건관리 · 팀 스케줄</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#14213d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="팀 스케줄" />
<style>
:root {
  --brand-navy:     #14213d;
  --brand-navy-dark:#0b1626;
  --brand-coral:    #ff6452;
  --brand-coral-dark:#e5503f;

  --surface-1:      #f7f8fa;
  --card-surface:   #ffffff;
  --text-primary:   #14213d;
  --text-secondary: #4b5a78;
  --text-muted:     #8993a6;
  --gridline:       #e2e6ed;
  --border:         rgba(20,33,61,0.12);

  --status-good:        #1e8e5a;
  --status-warning:     #d99a06;
  --status-serious:     #d9773e;
  --status-critical:    #d6394a;
  --status-good-bg:     #e3f5ec;
  --status-warning-bg:  #fbf0da;
  --status-serious-bg:  #fbebdd;
  --status-critical-bg: #fbe4e4;
  --status-muted-bg:    #eef0f4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", Roboto, sans-serif;
  background: var(--surface-1);
  color: var(--text-primary);
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: white; border-bottom: 1px solid var(--gridline);
  position: sticky; top: 0; z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-left h1 { font-size: 18px; margin: 0; color: var(--brand-navy); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-name { font-size: 14px; color: var(--text-secondary); font-weight: 600; }

button.btn-secondary, a.btn-secondary {
  background: #eef1f6; color: var(--text-secondary); border: 1px solid var(--gridline); padding: 8px 14px;
  border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block;
}
button.btn-secondary:hover, a.btn-secondary:hover { background: #e2e6ed; }
button.btn-primary {
  background: var(--brand-coral); color: white; border: none; padding: 10px 18px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.btn-primary:hover { background: var(--brand-coral-dark); }
button.btn-danger {
  background: #fbe4e4; color: #b23a3a; border: none; padding: 10px 18px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.btn-danger:hover { background: #f7d0d0; }
button.btn-small {
  font-size: 12px; padding: 5px 9px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card-surface); color: var(--text-secondary);
}
button.btn-small:hover { background: #eef1f6; }

main { max-width: 900px; margin: 0 auto; padding: 20px; }

/* ---- overdue / 미처리 alert banner (최상단 강조) ---- */
.overdue-alert {
  background: var(--status-critical-bg); border: 2px solid var(--status-critical); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 18px;
  animation: overdue-pulse 2.2s ease-in-out infinite;
}
.overdue-alert.hidden { display: none; }
.overdue-alert-header {
  font-size: 15px; font-weight: 800; color: var(--status-critical);
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px 2px;
}
.overdue-alert-count {
  background: var(--status-critical); color: #fff; border-radius: 999px;
  font-size: 12px; font-weight: 700; padding: 2px 9px;
}
.overdue-alert-list { display: flex; flex-direction: column; gap: 6px; }
.overdue-alert-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: var(--card-surface); border-radius: 8px; padding: 9px 12px;
  font-size: 13px; color: var(--text-primary); cursor: pointer;
}
.overdue-alert-row:hover { background: #fdf1ef; }
.overdue-alert-row b { color: var(--status-critical); }
.overdue-alert-row .btn-small { flex-shrink: 0; }
@keyframes overdue-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(208,59,59,0.0); }
  50% { box-shadow: 0 0 0 4px rgba(208,59,59,0.12); }
}

/* ---- stat tiles ---- */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-tile {
  background: var(--card-surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.stat-tile .label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
.stat-tile .value { font-size: 26px; font-weight: 700; }
.stat-tile.crit .value { color: var(--status-critical); }
.stat-tile.warn .value { color: var(--status-warning); }
.stat-tile.good .value { color: var(--status-good); }
@media (max-width: 640px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }

/* ---- filter bar ---- */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-bar select, .filter-bar input[type="text"] {
  font-family: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card-surface); color: var(--text-primary);
}
.filter-bar input[type="text"] { flex: 1; min-width: 140px; }

/* ---- section / card list ---- */
.section { margin-bottom: 20px; }
.section-title {
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;
  color: var(--text-secondary); margin: 0 0 8px 2px;
}
.section-title .count {
  background: var(--status-muted-bg); color: var(--text-secondary); border-radius: 999px;
  padding: 1px 8px; font-size: 12px; font-weight: 600;
}
.section.crit .section-title .count { background: var(--status-critical-bg); color: var(--status-critical); }
.section.warn .section-title .count { background: var(--status-warning-bg); color: var(--status-warning); }
.section.good .section-title .count { background: var(--status-good-bg); color: var(--status-good); }

.card-list { display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--card-surface); border: 1px solid var(--border); border-left: 4px solid var(--gridline);
  border-radius: 10px; padding: 11px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.card:hover { border-color: #b9c2d6; }
.card.crit { border-left-color: var(--status-critical); }
.card.warn { border-left-color: var(--status-warning); }
.card.good { border-left-color: var(--status-good); opacity: 0.75; }
.card.muted { border-left-color: var(--gridline); }
.card.unmatched { border-left-color: var(--status-serious); }

.card .badge {
  flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.card.crit .badge { background: var(--status-critical-bg); color: var(--status-critical); }
.card.warn .badge { background: var(--status-warning-bg); color: var(--status-warning); }
.card.good .badge { background: var(--status-good-bg); color: var(--status-good); }
.card.muted .badge { background: var(--status-muted-bg); color: var(--text-secondary); }
.card.unmatched .badge { background: var(--status-serious-bg); color: var(--status-serious); }

.card .body { flex: 1; min-width: 0; }
.card .title { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.card.good .title { text-decoration: line-through; color: var(--text-secondary); }
.card .meta { font-size: 12px; color: var(--text-secondary); }
.card .meta b { color: var(--text-primary); font-weight: 600; }
.card .due { flex-shrink: 0; font-size: 12px; color: var(--text-muted); text-align: right; min-width: 78px; }
.card .actions { flex-shrink: 0; }

.empty-note { font-size: 13px; color: var(--text-muted); padding: 20px 4px; text-align: center; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-secondary); margin: 4px 2px 24px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

.fab {
  position: fixed; right: 28px; bottom: 28px; padding: 14px 22px; border-radius: 999px;
  background: var(--brand-coral); color: white; border: none; font-size: 15px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(255,100,82,0.4); cursor: pointer;
}
.fab:hover { background: var(--brand-coral-dark); }
.fab-secondary {
  right: 28px; bottom: 92px; background: var(--card-surface); color: var(--text-primary);
  border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,0.12); font-size: 13px; padding: 10px 18px;
}
.fab-secondary:hover { background: #eef1f6; }

/* ---- 의뢰인 자동완성 ---- */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 2px); z-index: 20;
  max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card-surface); box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}
.autocomplete-list.hidden { display: none; }
.autocomplete-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--gridline); }
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover { background: var(--status-muted-bg); }
.autocomplete-item .name { font-size: 13px; font-weight: 600; }
.autocomplete-item .meta { font-size: 11px; color: var(--text-secondary); }
.picked-client-note {
  font-size: 12px; color: var(--status-good); background: var(--status-good-bg);
  border-radius: 8px; padding: 8px 10px; margin: 6px 0 0;
}

/* ---- modal (shared pattern) ---- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
  align-items: center; justify-content: center; z-index: 100;
}
.modal-backdrop.hidden { display: none; }
.modal {
  background: white; border-radius: 14px; padding: 28px; width: 520px; max-width: 92vw;
  max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal h2 { margin-top: 0; font-size: 18px; }
.modal h3 { font-size: 14px; margin: 18px 0 8px; color: var(--text-secondary); }
.modal label { display: block; font-size: 13px; margin: 12px 0 4px; color: var(--text-secondary); }
.modal input, .modal textarea, .modal select {
  width: 100%; padding: 9px 11px; border: 1px solid #d7dce6; border-radius: 8px; font-size: 14px;
  font-family: inherit; background: white;
}
.modal .row { display: flex; gap: 12px; }
.modal .row > div { flex: 1; }
.checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.checkbox-row input { width: auto; }
.modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.error-text { color: #b23a3a; font-size: 13px; margin: 6px 0 0; min-height: 0; }

.task-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.task-table th, .task-table td { text-align: left; padding: 7px 5px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
.task-table td.actions-cell { white-space: nowrap; text-align: right; }
.status-pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.status-pill.예정 { background: var(--status-muted-bg); color: var(--text-secondary); }
.status-pill.진행중 { background: var(--status-warning-bg); color: var(--status-warning); }
.status-pill.완료 { background: var(--status-good-bg); color: var(--status-good); }

.mini-form { background: #f7f8fa; border: 1px solid var(--gridline); border-radius: 10px; padding: 12px; margin-top: 10px; }
.mini-form-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }

@media (max-width: 640px) {
  .topbar { padding: 10px 14px; gap: 8px; flex-wrap: wrap; }
  .topbar-left h1 { font-size: 16px; }
  .topbar-right { gap: 6px; }
  .topbar-right .user-name { display: none; }
  button.btn-secondary, a.btn-secondary { padding: 7px 10px; font-size: 12px; }
  main { padding: 12px; }
  .fab {
    position: static; display: block; width: calc(100% - 24px);
    margin: 14px 12px 20px; border-radius: 10px; box-shadow: none;
    padding: 14px; font-size: 15px; text-align: center;
  }
  .modal { padding: 20px; width: 100%; border-radius: 14px 14px 0 0; overflow-x: auto; }
  .modal-backdrop { align-items: flex-end; }
  .modal .row { flex-direction: column; gap: 0; }
  .modal-actions { flex-wrap: wrap; }
  .modal-actions button { flex: 1 1 auto; }
  .task-table { font-size: 12px; min-width: 420px; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>⚖️ 사건관리</h1>
    </div>
    <div class="topbar-right">
      <a href="/app.html" class="btn-secondary">📅 팀 스케줄</a>
      <a href="/consultations.html" class="btn-secondary">🗂️ 상담관리</a>
      <a id="btn-client-search" href="/clients.html" class="btn-secondary">📋 의뢰인 목록</a>
      <a href="/settings.html" id="nav-settings" class="btn-secondary" style="display:none">⚙️ 설정</a>
      <button id="btn-sheets-export" class="btn-secondary" style="display:none">📊 구글시트로 내보내기</button>
      <span id="user-name" class="user-name"></span>
      <button id="btn-logout" class="btn-secondary">로그아웃</button>
    </div>
  </header>
  <p id="sheets-status" class="empty-note hidden" style="text-align:left; padding:6px 20px 0;"></p>

  <main>
    <div id="overdue-alert" class="overdue-alert hidden">
      <div class="overdue-alert-header">🔴 기한 초과 / 미처리 업무 <span id="overdue-alert-count" class="overdue-alert-count"></span></div>
      <div id="overdue-alert-list" class="overdue-alert-list"></div>
    </div>

    <div class="stat-row">
      <div class="stat-tile crit">
        <div class="label">🔴 오늘 마감</div>
        <div class="value" id="stat-today">0</div>
      </div>
      <div class="stat-tile crit">
        <div class="label">⛔ 기한초과</div>
        <div class="value" id="stat-overdue">0</div>
      </div>
      <div class="stat-tile warn">
        <div class="label">🟡 임박 (D-1~D-3)</div>
        <div class="value" id="stat-upcoming">0</div>
      </div>
      <div class="stat-tile good">
        <div class="label">✅ 완료</div>
        <div class="value" id="stat-done">0</div>
      </div>
    </div>

    <div class="filter-bar">
      <select id="filter-status">
        <option value="all">전체 상태</option>
        <option value="예정">예정만</option>
        <option value="진행중">진행중만</option>
        <option value="완료">완료만</option>
      </select>
      <select id="filter-assignee">
        <option value="all">전체 담당자</option>
      </select>
      <input type="text" id="filter-search" placeholder="의뢰인명 / 사건번호 검색" />
    </div>

    <div id="sections"></div>

    <div class="legend">
      <span>🔴 <span style="color:var(--status-critical)">오늘마감·기한초과</span></span>
      <span>🟡 <span style="color:var(--status-warning)">임박 D-1~D-3</span></span>
      <span>🔵 여유 (D-4 이상)</span>
      <span>✅ <span style="color:var(--status-good)">완료</span></span>
    </div>
  </main>

  <button id="btn-new-schedule" class="fab">+ 새 일정 등록</button>
  <button id="btn-new-case" class="fab fab-secondary">+ 사건 직접 추가</button>

  <!-- 새 일정 등록 모달 (의뢰인 명단 자동완성) -->
  <div id="schedule-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2>새 일정 등록</h2>
      <form id="schedule-form">
        <label>의뢰인 검색 * <span style="font-weight:400; color:var(--text-muted);">(이름 또는 사건번호 일부 입력)</span></label>
        <div class="autocomplete-wrap">
          <input type="text" id="sched-client-search" placeholder="예: 김철수 또는 2026개회" autocomplete="off" />
          <div id="sched-client-suggestions" class="autocomplete-list hidden"></div>
        </div>
        <input type="hidden" id="sched-client-name" />
        <input type="hidden" id="sched-client-caseno" />
        <p id="sched-client-picked" class="picked-client-note hidden"></p>

        <div class="row">
          <div>
            <label>업무구분 *</label>
            <input type="text" id="sched-task-type" list="task-type-options" required placeholder="예: 보정서 제출" />
            <datalist id="task-type-options">
              <option value="보정서 제출"></option>
              <option value="심문기일 출석"></option>
              <option value="서류 송달"></option>
              <option value="채권자 목록 보정"></option>
              <option value="변제계획안 제출"></option>
              <option value="보정명령 회신"></option>
              <option value="인가결정문 수령"></option>
            </datalist>
          </div>
          <div>
            <label>마감예정일 *</label>
            <input type="text" class="date-field" id="sched-due" required placeholder="yyyy-mm-dd" pattern="\d{4}-\d{2}-\d{2}" inputmode="numeric" maxlength="10" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>수령일 (서류 송달받은 날)</label>
            <input type="text" class="date-field" id="sched-received" placeholder="yyyy-mm-dd" pattern="\d{4}-\d{2}-\d{2}" inputmode="numeric" maxlength="10" />
          </div>
          <div>
            <label>담당자</label>
            <input type="text" id="sched-assignee" placeholder="예: 진홍" />
          </div>
        </div>
        <label>메모</label>
        <input type="text" id="sched-memo" />
        <p id="sched-error" class="error-text"></p>
        <div class="modal-actions">
          <div class="spacer"></div>
          <button type="button" class="btn-secondary" id="btn-cancel-schedule">닫기</button>
          <button type="submit" class="btn-primary" id="btn-save-schedule">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 의뢰인 상세 (기본정보는 시트 연동, 읽기 전용 / 인감도장·USB 수령 여부는 앱에서 직접 관리) -->
  <div id="client-info-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="client-info-title">의뢰인 정보</h2>
      <p id="client-info-body" style="font-size:14px; line-height:1.8;"></p>

      <h3>서류 수령 현황</h3>
      <div class="checkbox-row" style="margin-bottom:6px;">
        <input type="checkbox" id="ci-seal-received" />
        <label for="ci-seal-received" style="margin:0;">인감도장 수령함</label>
      </div>
      <div id="ci-seal-date-wrap" class="hidden">
        <label>수령일</label>
        <input type="text" class="date-field" id="ci-seal-date" placeholder="yyyy-mm-dd" pattern="\d{4}-\d{2}-\d{2}" inputmode="numeric" maxlength="10" />
      </div>

      <div class="checkbox-row" style="margin: 14px 0 6px;">
        <input type="checkbox" id="ci-cert-received" />
        <label for="ci-cert-received" style="margin:0;">공동인증서 USB 수령함</label>
      </div>
      <div id="ci-cert-date-wrap" class="hidden">
        <label>수령일</label>
        <input type="text" class="date-field" id="ci-cert-date" placeholder="yyyy-mm-dd" pattern="\d{4}-\d{2}-\d{2}" inputmode="numeric" maxlength="10" />
      </div>
      <p id="ci-docs-error" class="error-text"></p>

      <h3>현재 사건현황 (관련 일정)</h3>
      <table class="task-table" id="ci-task-table">
        <thead><tr><th>업무구분</th><th>마감예정일</th><th>상태</th></tr></thead>
        <tbody id="ci-task-tbody"></tbody>
      </table>
      <p id="ci-task-empty" class="empty-note hidden" style="padding:6px 0;">관련 일정이 없습니다.</p>

      <p id="ci-open-case-error" class="error-text"></p>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button type="button" class="btn-secondary" id="btn-close-client-info">닫기</button>
        <button type="button" class="btn-secondary" id="btn-add-schedule-for-client">+ 일정 추가</button>
        <button type="button" class="btn-secondary" id="btn-open-case-detail">사건상세 페이지 열기 →</button>
        <button type="button" class="btn-primary" id="btn-save-client-docs">저장</button>
      </div>
    </div>
  </div>

  <!-- 새 사건 추가 모달 (기본정보만 빠르게 입력 → 저장 후 사건상세 페이지로 이동) -->
  <div id="case-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2>사건 추가</h2>
      <form id="case-form">
        <label>의뢰인명 *</label>
        <input type="text" id="case-client" required />

        <div class="row">
          <div>
            <label>연락처</label>
            <input type="text" id="case-phone" placeholder="010-0000-0000" />
          </div>
          <div>
            <label>담당직원</label>
            <input type="text" id="case-assignee" placeholder="예: 진홍" />
          </div>
        </div>

        <div class="row">
          <div>
            <label>관할법원</label>
            <input type="text" id="case-court" placeholder="예: 수원회생법원" />
          </div>
          <div>
            <label>사건번호</label>
            <input type="text" id="case-caseno" placeholder="예: 2026개회12345" />
          </div>
        </div>

        <label>메모</label>
        <textarea id="case-memo" rows="2"></textarea>

        <p id="case-error" class="error-text"></p>

        <div class="modal-actions">
          <div class="spacer"></div>
          <button type="button" class="btn-secondary" id="btn-cancel-case">닫기</button>
          <button type="submit" class="btn-primary" id="btn-save-case">저장 후 상세페이지로 이동</button>
        </div>
      </form>
    </div>
  </div>

<script>
let currentUser = null;
let allCases = [];
let allTasks = [];

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (res.status === 401) { window.location.href = '/'; throw new Error('로그인이 필요합니다.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}

function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ---- 날짜칸: 브라우저/OS 로케일에 상관없이 항상 yyyy-mm-dd로 고정 ----
   네이티브 <input type="date">는 표시 형식이 로케일에 따라 달라지므로(예: mm/dd/yyyy),
   대신 텍스트 입력에 자동으로 하이픈을 붙여주는 방식으로 항상 yyyy-mm-dd만 입력/표시되게 한다. */
function isValidDateStr(s) {
  return /^\d{4}-\d{2}-\d{2}$/.test(s || '');
}
function maskDateInput(el) {
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g, '').slice(0, 8);
    let out = digits;
    if (digits.length > 4) out = digits.slice(0, 4) + '-' + digits.slice(4);
    if (digits.length > 6) out = digits.slice(0, 4) + '-' + digits.slice(4, 6) + '-' + digits.slice(6);
    el.value = out;
  });
}
document.querySelectorAll('input.date-field').forEach(maskDateInput);

/* ---- D-day / 분류 ---- */
function computeDDay(dateStr) {
  const due = new Date(dateStr + 'T00:00:00+09:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((due - today) / 86400000);
}

function classify(task) {
  if (task.source === 'sheet' && task.matched === false) return 'unmatched';
  if (task.status === '완료') return 'good';
  if (task.dDay < 0) return 'crit';
  if (task.dDay === 0) return 'crit';
  if (task.dDay >= 1 && task.dDay <= 3) return 'warn';
  return 'muted';
}

/* ---- 대시보드 렌더링 ---- */
function applyFilters(rows) {
  const status = document.getElementById('filter-status').value;
  const assignee = document.getElementById('filter-assignee').value;
  const q = document.getElementById('filter-search').value.trim().toLowerCase();
  return rows.filter((r) => {
    if (status !== 'all' && r.status !== status) return false;
    if (assignee !== 'all' && r.assignee_name !== assignee) return false;
    if (q && !(`${r.client_name} ${r.court_case_no}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

function cardHTML(t) {
  const cls = classify(t);
  const isUnmatched = cls === 'unmatched';
  let badgeText;
  if (isUnmatched) badgeText = '⚠️ 미등록';
  else if (t.status === '완료') badgeText = '완료';
  else if (t.dDay < 0) badgeText = `D+${Math.abs(t.dDay)} 초과`;
  else if (t.dDay === 0) badgeText = 'D-DAY';
  else badgeText = `D-${t.dDay}`;

  const icon = isUnmatched ? '⚠️' : t.status === '완료' ? '✅' : (t.status === '예정' && t.dDay < 0) ? '⛔' : (t.status === '예정' && t.dDay === 0) ? '🔴' : (t.status !== '완료' && t.dDay <= 3) ? '🟡' : '🔵';
  const receivedPart = t.received_date ? ` · 수령 ${escapeHTML(t.received_date)}` : '';
  const canQuickComplete = t.status !== '완료' && t.source !== 'sheet' && !isUnmatched;
  const metaText = isUnmatched
    ? '등록된 사건 목록에서 이름을 찾지 못했습니다. 클릭해서 사건을 등록해주세요.'
    : `담당: <b>${escapeHTML(t.assignee_name || '-')}</b> · ${escapeHTML(t.court || '')} ${escapeHTML(t.court_case_no || '')}${receivedPart}`;

  return `
    <div class="card ${cls}" data-case-id="${t.case_id != null ? t.case_id : ''}" data-matched="${isUnmatched ? 'false' : 'true'}" data-client-name="${escapeHTML(t.client_name || '')}">
      <span class="badge">${badgeText}</span>
      <div class="body">
        <p class="title">${icon} ${escapeHTML(t.client_name)} · ${escapeHTML(t.task_type)}</p>
        <p class="meta">${metaText}</p>
      </div>
      <div class="due">${t.due_date}</div>
      ${canQuickComplete ? `<div class="actions"><button type="button" class="btn-small" data-quick-complete="${t.id}">완료 처리</button></div>` : ''}
    </div>`;
}

function sectionHTML(title, cls, rows) {
  if (!rows.length) return '';
  return `
    <div class="section ${cls}">
      <p class="section-title">${title} <span class="count">${rows.length}건</span></p>
      <div class="card-list">${rows.map(cardHTML).join('')}</div>
    </div>`;
}

// 카드/알림 행을 클릭했을 때 공통 처리. 세 가지 경우가 있다:
// 1) 의뢰인 명단(시트1 등)에서 이름을 못 찾음 → 철자 확인 안내
// 2) 의뢰인 명단에서 찾았지만 앱 자체 사건(SQLite)이 아님 → 읽기 전용 의뢰인 정보 보기
// 3) 앱에서 직접 등록한 사건(SQLite) → 사건상세 페이지로 이동
function handleTaskItemClick(caseId, matched, clientName) {
  if (matched === false) {
    alert(`'${clientName}' 님을 의뢰인 명단에서 찾을 수 없습니다. 이름 철자를 확인해주세요.`);
    return;
  }
  if (caseId && String(caseId).startsWith('client-')) {
    openClientInfoModal(caseId, clientName);
    return;
  }
  window.location.href = `/case-detail.html?id=${Number(caseId)}`;
}

function overdueAlertRowHTML(t) {
  const days = Math.abs(t.dDay);
  const canQuickComplete = t.status !== '완료' && t.source !== 'sheet';
  const matched = t.source === 'sheet' ? t.matched !== false : true;
  return `
    <div class="overdue-alert-row" data-case-id="${t.case_id != null ? t.case_id : ''}" data-matched="${matched ? 'true' : 'false'}" data-client-name="${escapeHTML(t.client_name || '')}">
      <span>⚠️ [${escapeHTML(t.client_name)}] ${escapeHTML(t.task_type)} 제출 기한이 <b>${days}일</b> 지났습니다! (마감일: ${t.due_date})</span>
      ${canQuickComplete ? `<button type="button" class="btn-small" data-quick-complete="${t.id}">완료 처리</button>` : ''}
    </div>`;
}

// 마감일이 지났는데 아직 완료되지 않은(=미처리) 건들을 대시보드 최상단에 강조 표시.
// 필터바 상태와 무관하게 항상 전체 데이터 기준으로 보여준다 (필터로 놓치면 안 되는 경고이므로).
function renderOverdueAlert(withDday) {
  const box = document.getElementById('overdue-alert');
  const list = document.getElementById('overdue-alert-list');
  const countEl = document.getElementById('overdue-alert-count');

  const overdueUnprocessed = withDday.filter((t) => t.status !== '완료' && t.dDay < 0).sort((a, b) => a.dDay - b.dDay);

  if (!overdueUnprocessed.length) {
    box.classList.add('hidden');
    list.innerHTML = '';
    return;
  }

  countEl.textContent = `${overdueUnprocessed.length}건`;
  list.innerHTML = overdueUnprocessed.map(overdueAlertRowHTML).join('');
  box.classList.remove('hidden');

  list.querySelectorAll('[data-quick-complete]').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); quickComplete(btn.dataset.quickComplete); });
  });
  list.querySelectorAll('.overdue-alert-row').forEach((row) => {
    row.addEventListener('click', () => {
      handleTaskItemClick(row.dataset.caseId, row.dataset.matched === 'true', row.dataset.clientName);
    });
  });
}

function render() {
  const withDday = allTasks.map((t) => Object.assign({}, t, { dDay: computeDDay(t.due_date) }));
  const filtered = applyFilters(withDday);

  renderOverdueAlert(withDday);

  const overdue = filtered.filter((t) => t.status !== '완료' && t.dDay < 0).sort((a,b)=>a.dDay-b.dDay);
  const today = filtered.filter((t) => t.status !== '완료' && t.dDay === 0);
  const upcoming = filtered.filter((t) => t.status !== '완료' && t.dDay >= 1 && t.dDay <= 3).sort((a,b)=>a.dDay-b.dDay);
  const later = filtered.filter((t) => t.status !== '완료' && t.dDay > 3).sort((a,b)=>a.dDay-b.dDay);
  const done = filtered.filter((t) => t.status === '완료').sort((a,b)=>b.due_date.localeCompare(a.due_date));

  document.getElementById('stat-today').textContent = withDday.filter(t=>t.status!=='완료'&&t.dDay===0).length;
  document.getElementById('stat-overdue').textContent = withDday.filter(t=>t.status!=='완료'&&t.dDay<0).length;
  document.getElementById('stat-upcoming').textContent = withDday.filter(t=>t.status!=='완료'&&t.dDay>=1&&t.dDay<=3).length;
  document.getElementById('stat-done').textContent = withDday.filter(t=>t.status==='완료').length;

  const html = [
    sectionHTML('⛔ 기한초과', 'crit', overdue),
    sectionHTML('🔴 오늘 마감', 'crit', today),
    sectionHTML('🟡 임박 (D-1~D-3)', 'warn', upcoming),
    sectionHTML('🔵 여유 (D-4 이상)', '', later),
    sectionHTML('✅ 완료', 'good', done),
  ].join('');

  document.getElementById('sections').innerHTML = html ||
    '<p class="empty-note">조건에 맞는 사건 일정이 없습니다. 오른쪽 아래 + 버튼으로 사건을 추가해보세요.</p>';

  document.querySelectorAll('[data-quick-complete]').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); quickComplete(btn.dataset.quickComplete); });
  });
  document.querySelectorAll('.card').forEach((card) => {
    card.addEventListener('click', () => {
      handleTaskItemClick(card.dataset.caseId, card.dataset.matched === 'true', card.dataset.clientName);
    });
  });
}

function populateAssigneeFilter() {
  const select = document.getElementById('filter-assignee');
  const current = select.value;
  const names = Array.from(new Set(allTasks.map((t) => t.assignee_name).filter(Boolean)));
  select.innerHTML = '<option value="all">전체 담당자</option>' +
    names.map((n) => `<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join('');
  select.value = current && names.includes(current) ? current : 'all';
}

async function quickComplete(taskId) {
  await api(`/api/case-tasks/${taskId}`, { method: 'PATCH', body: JSON.stringify({ status: '완료' }) });
  await loadAll();
}

async function loadAll() {
  [allCases, allTasks] = await Promise.all([api('/api/cases'), api('/api/case-tasks')]);
  populateAssigneeFilter();
  render();
}

/* ---- 사건 모달 ---- */
// 사건 추가는 기본정보만 빠르게 입력받고, 나머지(사건유형·현재단계·수임료·서류일정 등)는
// 저장 직후 이동하는 사건상세 페이지(case-detail.html)에서 관리한다.
function openCaseModal() {
  document.getElementById('case-error').textContent = '';
  document.getElementById('case-form').reset();
  document.getElementById('case-modal').classList.remove('hidden');
}
function closeCaseModal() {
  document.getElementById('case-modal').classList.add('hidden');
}

document.getElementById('case-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('case-error');
  errorEl.textContent = '';
  const payload = {
    client_name: document.getElementById('case-client').value.trim(),
    phone: document.getElementById('case-phone').value.trim(),
    assignee_name: document.getElementById('case-assignee').value.trim(),
    court: document.getElementById('case-court').value.trim(),
    court_case_no: document.getElementById('case-caseno').value.trim(),
    memo: document.getElementById('case-memo').value.trim(),
  };
  try {
    const created = await api('/api/cases', { method: 'POST', body: JSON.stringify(payload) });
    window.location.href = `/case-detail.html?id=${created.id}`;
  } catch (err) {
    errorEl.textContent = err.message;
  }
});

document.getElementById('btn-new-case').addEventListener('click', () => openCaseModal());
document.getElementById('btn-cancel-case').addEventListener('click', closeCaseModal);

document.getElementById('filter-status').addEventListener('change', render);
document.getElementById('filter-assignee').addEventListener('change', render);
document.getElementById('filter-search').addEventListener('input', render);

document.getElementById('btn-logout').addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST' });
  window.location.href = '/';
});

/* ---- 구글시트로 내보내기 (백업/공유용, 1-way. 실제 저장소는 계속 이 앱입니다) ---- */

function formatSyncedAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, da: d.getUTCDate(),
    h: (d.getUTCHours() + 9) % 24, mi: d.getUTCMinutes() };
  // 날짜가 UTC+9로 넘어갈 수 있어 시각만 보정, 날짜 표기는 대략적인 안내용
  return `${p.y}.${String(p.mo).padStart(2,'0')}.${String(p.da).padStart(2,'0')} ${String(p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')}`;
}

let sheetsStatus = { exported: false, url: null, tasksManagedInSheet: false };

async function refreshSheetsStatus() {
  const statusEl = document.getElementById('sheets-status');
  try {
    sheetsStatus = await api('/api/sheets/status');
    const parts = [];
    if (sheetsStatus.exported) {
      const managedNote = sheetsStatus.tasksManagedInSheet ? ' · 서류·보정 일정은 시트에서 직접 관리 중' : '';
      parts.push(`📊 <a href="${sheetsStatus.url}" target="_blank" rel="noopener">구글시트에서 보기</a> · 마지막 동기화: ${formatSyncedAt(sheetsStatus.lastSyncedAt)}${managedNote}`);
    }
    if (parts.length) {
      statusEl.innerHTML = parts.join(' · ');
      statusEl.classList.remove('hidden');
    } else {
      statusEl.classList.add('hidden');
    }
  } catch { statusEl.classList.add('hidden'); }
}

/* ---- 의뢰인 목록 (getClients / addSchedule 역할, SQLite cases 기반) ---- */

let allClients = [];

async function loadClients() {
  try { allClients = await api('/api/clients'); } catch { allClients = []; }
}

function clientSuggestionHTML(c) {
  return `<div class="autocomplete-item" data-name="${escapeHTML(c.client_name)}" data-caseno="${escapeHTML(c.court_case_no || '')}" data-court="${escapeHTML(c.court || '')}">
    <div class="name">${escapeHTML(c.client_name)}</div>
    <div class="meta">${escapeHTML(c.court || '')}${c.court ? ' · ' : ''}${escapeHTML(c.court_case_no || '')}</div>
  </div>`;
}

function pickClient(name, court, courtCaseNo) {
  document.getElementById('sched-client-search').value = name;
  document.getElementById('sched-client-name').value = name;
  document.getElementById('sched-client-caseno').value = courtCaseNo || '';
  const picked = document.getElementById('sched-client-picked');
  picked.textContent = `✅ 선택됨: ${name}${court ? ' · ' + court : ''}${courtCaseNo ? ' · ' + courtCaseNo : ''}`;
  picked.classList.remove('hidden');
  document.getElementById('sched-client-suggestions').classList.add('hidden');
}

const schedSearchInput = document.getElementById('sched-client-search');
const schedSuggestBox = document.getElementById('sched-client-suggestions');

schedSearchInput.addEventListener('input', () => {
  document.getElementById('sched-client-name').value = '';
  document.getElementById('sched-client-caseno').value = '';
  document.getElementById('sched-client-picked').classList.add('hidden');

  const q = schedSearchInput.value.trim().toLowerCase();
  if (!q) { schedSuggestBox.classList.add('hidden'); schedSuggestBox.innerHTML = ''; return; }

  const matches = allClients.filter((c) =>
    (c.client_name || '').toLowerCase().includes(q) || (c.court_case_no || '').toLowerCase().includes(q)
  ).slice(0, 20);

  if (!matches.length) {
    schedSuggestBox.innerHTML = '<div class="autocomplete-item"><span class="meta">일치하는 의뢰인이 없습니다</span></div>';
    schedSuggestBox.classList.remove('hidden');
    return;
  }
  schedSuggestBox.innerHTML = matches.map(clientSuggestionHTML).join('');
  schedSuggestBox.classList.remove('hidden');
  schedSuggestBox.querySelectorAll('.autocomplete-item').forEach((item) => {
    if (!item.dataset.name) return;
    item.addEventListener('click', () => pickClient(item.dataset.name, item.dataset.court, item.dataset.caseno));
  });
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#sched-client-search') && !e.target.closest('#sched-client-suggestions')) {
    schedSuggestBox.classList.add('hidden');
  }
});

function openScheduleModal(prefillClient) {
  document.getElementById('schedule-form').reset();
  document.getElementById('sched-error').textContent = '';
  document.getElementById('sched-client-picked').classList.add('hidden');
  document.getElementById('sched-client-name').value = '';
  document.getElementById('sched-client-caseno').value = '';
  schedSuggestBox.classList.add('hidden');
  if (prefillClient) {
    pickClient(prefillClient.client_name, prefillClient.court, prefillClient.court_case_no);
  }
  document.getElementById('schedule-modal').classList.remove('hidden');
}
function closeScheduleModal() {
  document.getElementById('schedule-modal').classList.add('hidden');
}

document.getElementById('btn-new-schedule').addEventListener('click', async () => {
  await loadClients();
  openScheduleModal(null);
});
document.getElementById('btn-cancel-schedule').addEventListener('click', closeScheduleModal);

document.getElementById('schedule-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('sched-error');
  errorEl.textContent = '';
  const clientName = document.getElementById('sched-client-name').value;
  if (!clientName) { errorEl.textContent = '자동완성 목록에서 의뢰인을 선택해주세요.'; return; }

  const payload = {
    client_name: clientName,
    court_case_no: document.getElementById('sched-client-caseno').value,
    task_type: document.getElementById('sched-task-type').value.trim(),
    due_date: document.getElementById('sched-due').value,
    received_date: document.getElementById('sched-received').value,
    assignee_name: document.getElementById('sched-assignee').value.trim(),
    memo: document.getElementById('sched-memo').value.trim(),
  };

  const btn = document.getElementById('btn-save-schedule');
  btn.disabled = true;
  try {
    await api('/api/clients/schedule', { method: 'POST', body: JSON.stringify(payload) });
    closeScheduleModal();
    await loadAll();
    alert(`✅ 저장되었습니다: ${clientName} · ${payload.task_type} (마감 ${payload.due_date})`);
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

/* ---- 의뢰인 상세 (사건현황 + 인감도장/공동인증서 USB 수령 여부) ----
   ※ 의뢰인 전체 목록/검색은 별도 화면(clients.html)으로 분리되어 있음.
   여기서는 대시보드 카드(연동된 외부 의뢰인)를 클릭했을 때의 상세 보기만 담당한다. */

let openClientDoc = null; // 현재 상세 모달에 열려 있는 의뢰인 {client_name, court_case_no, ...}

function openClientInfoModal(clientOrId, fallbackName) {
  const c = (typeof clientOrId === 'object' && clientOrId)
    ? clientOrId
    : allClients.find((x) => x.id === clientOrId) || { client_name: fallbackName };
  openClientDoc = c;

  document.getElementById('client-info-title').textContent = c.client_name || fallbackName || '의뢰인 정보';
  document.getElementById('client-info-body').innerHTML =
    (c.court ? `관할: ${escapeHTML(c.court)}<br>` : '') +
    (c.court_case_no ? `사건번호: ${escapeHTML(c.court_case_no)}<br>` : '') +
    (c.phone ? `연락처: ${escapeHTML(c.phone)}<br>` : '') +
    `<span style="color:var(--text-secondary); font-size:12px;">※ 위 기본정보는 연동된 구글시트에서 가져온 것으로, 앱에서 수정할 수 없습니다.</span>`;

  document.getElementById('ci-docs-error').textContent = '';
  document.getElementById('ci-seal-received').checked = !!c.seal_received;
  document.getElementById('ci-seal-date').value = c.seal_received_date || '';
  document.getElementById('ci-seal-date-wrap').classList.toggle('hidden', !c.seal_received);
  document.getElementById('ci-cert-received').checked = !!c.cert_usb_received;
  document.getElementById('ci-cert-date').value = c.cert_usb_received_date || '';
  document.getElementById('ci-cert-date-wrap').classList.toggle('hidden', !c.cert_usb_received);

  // 현재 사건현황: 이미 불러온 일정 목록(allTasks)에서 이 의뢰인 것만 골라 보여준다
  const nameKey = (c.client_name || '').trim().replace(/\s+/g, '');
  const related = (allTasks || []).filter((t) => (t.client_name || '').trim().replace(/\s+/g, '') === nameKey)
    .sort((a, b) => a.due_date.localeCompare(b.due_date));
  const tbody = document.getElementById('ci-task-tbody');
  const emptyNote = document.getElementById('ci-task-empty');
  if (!related.length) {
    tbody.innerHTML = '';
    emptyNote.classList.remove('hidden');
  } else {
    emptyNote.classList.add('hidden');
    tbody.innerHTML = related.map((t) => `
      <tr>
        <td>${escapeHTML(t.task_type)}</td>
        <td>${t.due_date}</td>
        <td><span class="status-pill ${t.status}">${t.status}</span></td>
      </tr>`).join('');
  }

  document.getElementById('client-info-modal').classList.remove('hidden');
  document.getElementById('btn-add-schedule-for-client').onclick = () => {
    document.getElementById('client-info-modal').classList.add('hidden');
    openScheduleModal(c);
  };

  const openCaseErrorEl = document.getElementById('ci-open-case-error');
  openCaseErrorEl.textContent = '';
  document.getElementById('btn-open-case-detail').onclick = async () => {
    openCaseErrorEl.textContent = '';
    const btn = document.getElementById('btn-open-case-detail');
    btn.disabled = true;
    try {
      const result = await api('/api/clients/open-case', {
        method: 'POST',
        body: JSON.stringify({
          client_name: c.client_name || '',
          phone: c.phone || '',
          court: c.court || '',
          court_case_no: c.court_case_no || '',
        }),
      });
      window.location.href = `/case-detail.html?id=${result.id}`;
    } catch (err) {
      openCaseErrorEl.textContent = err.message;
      btn.disabled = false;
    }
  };
}
document.getElementById('btn-close-client-info').addEventListener('click', () => {
  document.getElementById('client-info-modal').classList.add('hidden');
});

document.getElementById('ci-seal-received').addEventListener('change', (e) => {
  document.getElementById('ci-seal-date-wrap').classList.toggle('hidden', !e.target.checked);
});
document.getElementById('ci-cert-received').addEventListener('change', (e) => {
  document.getElementById('ci-cert-date-wrap').classList.toggle('hidden', !e.target.checked);
});

document.getElementById('btn-save-client-docs').addEventListener('click', async () => {
  const errorEl = document.getElementById('ci-docs-error');
  errorEl.textContent = '';
  if (!openClientDoc) return;

  const sealDate = document.getElementById('ci-seal-date').value;
  const certDate = document.getElementById('ci-cert-date').value;
  if (sealDate && !isValidDateStr(sealDate)) { errorEl.textContent = '인감도장 수령일은 yyyy-mm-dd 형식으로 입력해주세요.'; return; }
  if (certDate && !isValidDateStr(certDate)) { errorEl.textContent = '공동인증서 수령일은 yyyy-mm-dd 형식으로 입력해주세요.'; return; }

  const payload = {
    client_name: openClientDoc.client_name,
    court_case_no: openClientDoc.court_case_no || '',
    seal_received: document.getElementById('ci-seal-received').checked,
    seal_received_date: document.getElementById('ci-seal-date').value,
    cert_usb_received: document.getElementById('ci-cert-received').checked,
    cert_usb_received_date: document.getElementById('ci-cert-date').value,
  };

  const btn = document.getElementById('btn-save-client-docs');
  btn.disabled = true;
  try {
    const saved = await api('/api/clients/documents', { method: 'POST', body: JSON.stringify(payload) });
    Object.assign(openClientDoc, saved);
    // 캐시된 의뢰인 목록에도 반영해서 검색 배지가 바로 갱신되게 한다
    const cached = allClients.find((x) => x.id === openClientDoc.id);
    if (cached) Object.assign(cached, saved);
    errorEl.textContent = '';
    errorEl.style.color = 'var(--status-good)';
    errorEl.textContent = '✅ 저장되었습니다.';
  } catch (err) {
    errorEl.style.color = '';
    errorEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btn-sheets-export').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '내보내는 중...';
  try {
    const result = await api('/api/sheets/export', { method: 'POST' });
    await refreshSheetsStatus();
    const msg = result.firstTime
      ? `구글시트를 새로 만들었습니다 (사건 ${result.caseCount}건). 직원 이메일이 등록되어 있으면 자동으로 편집 권한을 공유했습니다.\n앞으로 서류·보정 일정(일정_보정관리 탭)은 직원이 시트에서 직접 입력하면 됩니다.\n지금 열어볼까요?`
      : `사건목록 탭을 최신 사건 ${result.caseCount}건으로 갱신했습니다.\n(서류·보정 일정 탭은 직원이 직접 관리 중이라 건드리지 않았습니다)\n지금 열어볼까요?`;
    if (confirm(msg)) window.open(result.url, '_blank');
  } catch (err) {
    alert(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

async function init() {
  try {
    currentUser = await api('/api/auth/me');
  } catch {
    window.location.href = '/';
    return;
  }
  document.getElementById('user-name').textContent = `${currentUser.name} 님`;
  if (currentUser.role === 'admin') {
    document.getElementById('btn-sheets-export').style.display = 'inline-block';
    document.getElementById('nav-settings').style.display = 'inline-block';
  }
  await refreshSheetsStatus();
  await loadClients();
  await loadAll();

  // 의뢰인 목록(clients.html)에서 "+ 일정 추가"로 넘어온 경우 새 일정 등록 모달을 바로 열어준다.
  const params = new URLSearchParams(window.location.search);
  if (params.get('newSchedule')) {
    openScheduleModal({
      client_name: params.get('newSchedule') || '',
      court: params.get('court') || '',
      court_case_no: params.get('caseno') || '',
    });
    history.replaceState(null, '', '/cases.html');
  }
  // 설정 페이지에서 "여기서 관리하기" 버튼으로 넘어온 경우 해당 모달을 바로 열어준다.
  if (params.get('open') === 'sheetsExport' && currentUser.role === 'admin') {
    document.getElementById('btn-sheets-export').click();
    history.replaceState(null, '', '/cases.html');
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}

init();
</script>
</body>
</html>
