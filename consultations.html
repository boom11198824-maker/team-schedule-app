<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>상담관리 · 사건관리</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#14213d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="팀 스케줄" />
<style>
:root {
  --brand-navy:     #14213d;
  --brand-navy-dark:#0b1626;
  --brand-coral:    #ff6452;
  --brand-coral-dark:#e5503f;

  --surface-1:      #f7f8fa;
  --card-surface:   #ffffff;
  --text-primary:   #14213d;
  --text-secondary: #4b5a78;
  --text-muted:     #8993a6;
  --gridline:       #e2e6ed;
  --border:         rgba(20,33,61,0.12);

  --status-good:        #1e8e5a;
  --status-warning:     #d99a06;
  --status-serious:     #d9773e;
  --status-critical:    #d6394a;
  --status-good-bg:     #e3f5ec;
  --status-warning-bg:  #fbf0da;
  --status-serious-bg:  #fbebdd;
  --status-critical-bg: #fbe4e4;
  --status-muted-bg:    #eef0f4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", Roboto, sans-serif;
  background: var(--surface-1);
  color: var(--text-primary);
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: white; border-bottom: 1px solid var(--gridline);
  position: sticky; top: 0; z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-left h1 { font-size: 18px; margin: 0; color: var(--brand-navy); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-name { font-size: 14px; color: var(--text-secondary); font-weight: 600; }

button.btn-secondary, a.btn-secondary {
  background: #eef1f6; color: var(--text-secondary); border: 1px solid var(--gridline); padding: 8px 14px;
  border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block;
}
button.btn-secondary:hover, a.btn-secondary:hover { background: #e2e6ed; }
a.btn-secondary.active { background: var(--brand-navy); color: white; border-color: var(--brand-navy); }
button.btn-primary {
  background: var(--brand-coral); color: white; border: none; padding: 10px 18px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.btn-primary:hover { background: var(--brand-coral-dark); }
button.btn-primary:disabled { opacity: 0.6; cursor: default; }

main { max-width: 1000px; margin: 0 auto; padding: 20px 20px 80px; }

.page-title { display: flex; align-items: baseline; gap: 10px; margin: 4px 2px 16px; }
.page-title h2 { margin: 0; font-size: 20px; }
.page-title .count { font-size: 13px; color: var(--text-secondary); }

.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-bar input[type="text"] {
  flex: 1; min-width: 160px; font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card-surface); color: var(--text-primary);
}
.filter-bar select {
  font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card-surface); color: var(--text-primary);
}

.empty-note { font-size: 13px; color: var(--text-muted); padding: 24px 4px; text-align: center; }

.table-wrap {
  background: var(--card-surface); border: 1px solid var(--border); border-radius: 12px;
  overflow-x: auto; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
table.client-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
table.client-table th {
  text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 700; color: var(--text-secondary);
  border-bottom: 1px solid var(--gridline); white-space: nowrap;
}
table.client-table td { padding: 11px 14px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
table.client-table tr:last-child td { border-bottom: none; }
table.client-table tr.client-row { cursor: pointer; }
table.client-table tr.client-row:hover td { background: var(--status-muted-bg); }
table.client-table td.name-cell { font-weight: 700; white-space: nowrap; }
table.client-table td.muted { color: var(--text-muted); }
.memo-cell { color: var(--text-secondary); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.memo-cell:hover { text-decoration: underline; }
.memo-cell.empty { cursor: default; }
.memo-cell.empty:hover { text-decoration: none; }
.memo-detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--gridline); font-size: 14px; }
.memo-detail-row:last-child { border-bottom: none; }
.memo-detail-row .label { color: var(--text-muted); flex: 0 0 auto; }
.memo-detail-row .value { font-weight: 600; text-align: right; }
.memo-detail-rest { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gridline); font-size: 13px; color: var(--text-secondary); white-space: pre-wrap; }

.status-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.status-pill.상담중 { background: var(--status-warning-bg); color: var(--status-warning); }
.status-pill.접수전 { background: var(--status-muted-bg); color: var(--text-secondary); }
.status-pill.사건진행중 { background: var(--status-good-bg); color: var(--status-good); }
.status-pill.개시결정후 { background: #e3e9fb; color: var(--brand-navy); }
.status-pill.미지정 { background: var(--status-muted-bg); color: var(--text-muted); }

/* ---- 고객등급(client_grade): 상담관리의 영업 파이프라인 축. status(사건 진행 단계)와는 별개다. ---- */
.grade-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.grade-pill.g0 { background: var(--status-good-bg); color: var(--status-good); }
.grade-pill.g1 { background: var(--brand-coral); color: white; }
.grade-pill.g2 { background: var(--status-warning-bg); color: var(--status-warning); }
.grade-pill.g3 { background: var(--status-muted-bg); color: var(--text-secondary); }
.grade-pill.g4 { background: var(--status-serious-bg); color: var(--status-serious); }
.grade-pill.g5 { background: var(--status-critical-bg); color: var(--status-critical); }
.grade-pill.gnone { background: var(--status-muted-bg); color: var(--text-muted); }
.grade-pill.editable { cursor: pointer; }
.grade-pill.editable:hover { filter: brightness(0.95); }
.alimtalk-line { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.alimtalk-btn {
  border: 1px solid var(--gridline); background: white; color: var(--text-secondary); font-size: 10px;
  padding: 1px 6px; border-radius: 999px; cursor: pointer; line-height: 1.6; font-family: inherit;
}
.alimtalk-btn:hover { background: var(--status-muted-bg); }
.alimtalk-btn:disabled { opacity: 0.5; cursor: default; }

.grade-options { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; max-height: 46vh; overflow-y: auto; }
.grade-option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 8px; border-radius: 8px; cursor: pointer; }
.grade-option:hover { background: var(--status-muted-bg); }
.grade-option input { width: auto; margin: 3px 0 0; }
.grade-option-main { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.grade-option-desc { color: var(--text-muted); font-size: 12px; font-weight: 400; }

/* ---- modal ---- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
  align-items: center; justify-content: center; z-index: 100;
}
.modal-backdrop.hidden { display: none; }
.modal {
  background: white; border-radius: 14px; padding: 28px; width: 460px; max-width: 92vw;
  max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal h2 { margin-top: 0; font-size: 18px; }
.modal label { display: block; font-size: 13px; margin: 12px 0 4px; color: var(--text-secondary); }
.modal input, .modal select, .modal textarea {
  width: 100%; padding: 9px 11px; border: 1px solid #d7dce6; border-radius: 8px; font-size: 14px;
  font-family: inherit; background: white;
}
.modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.error-text { color: #b23a3a; font-size: 13px; margin: 6px 0 0; min-height: 0; }

@media (max-width: 640px) {
  .topbar { padding: 10px 14px; gap: 8px; flex-wrap: wrap; }
  .topbar-left h1 { font-size: 16px; }
  .topbar-right { gap: 6px; }
  .topbar-right .user-name { display: none; }
  button.btn-secondary, a.btn-secondary { padding: 7px 10px; font-size: 12px; }
  main { padding: 12px; }
  .modal { padding: 20px; width: 100%; border-radius: 14px 14px 0 0; }
  .modal-backdrop { align-items: flex-end; }
  .modal-actions { flex-wrap: wrap; }
  .modal-actions button { flex: 1 1 auto; }
}
</style>
</head>
<body>

    <div class="topbar-left">

    </div>
    <div class="topbar-right">
      <a href="/app.html" class="btn-secondary">📅 팀 스케줄</a>
      <a href="/cases.html" id="nav-cases" class="btn-secondary">⚖️ 사건관리</a>
      <a href="/consultations.html" class="btn-secondary active">🗂️ 상담관리</a>
      <a href="/clients.html" id="nav-clients" class="btn-secondary">📋 의뢰인 목록</a>

<script>
let currentUser = null;
let allCases = [];
let appSettings = { default_assignee_name: '', default_lawyer_name: '' };

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (res.status === 401) { window.location.href = '/'; throw new Error('로그인이 필요합니다.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}

function hasTab(user, tab) {
  if (!user) return false;
  if (user.role === 'admin') return true;
  if (user.allowed_tabs === null || user.allowed_tabs === undefined) return true;
  return String(user.allowed_tabs).split(',').map((s) => s.trim()).filter(Boolean).includes(tab);
}

function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ---- 날짜칸: 브라우저/OS 로케일에 상관없이 항상 yyyy-mm-dd로 고정 ---- */
function isValidDateStr(s) {
  return /^\d{4}-\d{2}-\d{2}$/.test(s || '');
}
function maskDateInput(el) {
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g, '').slice(0, 8);
    let out = digits;
    if (digits.length > 4) out = digits.slice(0, 4) + '-' + digits.slice(4);
    if (digits.length > 6) out = digits.slice(0, 4) + '-' + digits.slice(4, 6) + '-' + digits.slice(6);
    el.value = out;
  });
}
document.querySelectorAll('input.date-field').forEach(maskDateInput);

function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* ---- 메모: 상담결과리포트에서 자동 저장한 "[상담결과리포트 자동요약]...[/상담결과리포트 자동요약]" 블록을
   목록에서는 "지역/소득형태/소득/채무" 형태로 짧게 보여주고, 클릭하면 전체 항목을 팝업으로 보여준다.
   (같은 데이터를 파싱만 다르게 하는 것이라 서버/DB는 그대로 - OSMU) ---- */
const MEMO_AUTO_START = '[상담결과리포트 자동요약]';
const MEMO_AUTO_END = '[/상담결과리포트 자동요약]';

function parseAutoMemo(memo) {
  const src = memo || '';
  const si = src.indexOf(MEMO_AUTO_START);
  const ei = src.indexOf(MEMO_AUTO_END);
  if (si < 0 || ei < 0 || ei <= si) return null;
  const block = src.slice(si + MEMO_AUTO_START.length, ei).trim();
  const fields = {};
  block.split('\n').forEach((line) => {
    const idx = line.indexOf(':');
    if (idx < 0) return;
    fields[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
  });
  const rest = (src.slice(0, si) + src.slice(ei + MEMO_AUTO_END.length)).trim();
  return { fields, rest };
}

// 상담결과리포트는 설정(amtMode)에 따라 "4,400,000원" 같은 순수 숫자 형식으로도,
// "1억 2,300만원"처럼 억/만 단위가 섞인 한글 형식으로도 저장될 수 있다.
// 단순히 숫자만 뽑아 이어붙이면 "1억 2,300만원"이 "12300"(=1만2300원)으로 잘못 해석되므로
// 억/만 단위를 각각 인식해서 실제 금액(원)으로 정확히 환산한다.
function parseWonAmount(rawStr) {
  const s = String(rawStr || '').trim();
  if (!s) return 0;
  if (s.indexOf('억') >= 0 || s.indexOf('만') >= 0) {
    let total = 0;
    let rest = s;
    const eokM = rest.match(/([\d,]+)\s*억/);
    if (eokM) {
      total += parseInt(eokM[1].replace(/,/g, ''), 10) * 100000000;
      rest = rest.slice(eokM.index + eokM[0].length);
    }
    const manM = rest.match(/([\d,]+)\s*만/);
    if (manM) {
      total += parseInt(manM[1].replace(/,/g, ''), 10) * 10000;
      rest = rest.slice(manM.index + manM[0].length);
    }
    const wonM = rest.match(/([\d,]+)/);
    if (wonM) total += parseInt(wonM[1].replace(/,/g, ''), 10);
    return total;
  }
  const digits = s.replace(/[^0-9]/g, '');
  return digits ? parseInt(digits, 10) : 0;
}

// 환산된 원 단위 금액을 "440만원"/"2억"처럼 압축해서 목록에서 한눈에 보이게 한다.
function compactAmount(rawStr) {
  const n = parseWonAmount(rawStr);
  if (!Number.isFinite(n) || n <= 0) return '';
  if (n >= 100000000) {
    const eok = Math.floor(n / 100000000);
    const manRest = Math.round((n % 100000000) / 10000);
    return manRest > 0 ? `${eok}억${manRest}만원` : `${eok}억`;
  }
  return `${Math.round(n / 10000)}만원`;
}

function memoCellHTML(c) {
  const parsed = parseAutoMemo(c.memo);
  if (!parsed) return escapeHTML(c.memo || '');
  const f = parsed.fields;
  const parts = [f['지역'], f['소득형태'], compactAmount(f['소득'])].filter(Boolean);
  const debt = compactAmount(f['채무금액']);
  if (debt) parts.push(`채무${debt}`);
  return escapeHTML(parts.join('/') + (parts.length ? '/' : ''));
}

function openMemoModal(c) {
  const parsed = parseAutoMemo(c.memo);
  const fieldsEl = document.getElementById('memo-modal-fields');
  const restEl = document.getElementById('memo-modal-rest');
  document.getElementById('memo-modal-title').textContent = `${c.client_name} 상담 요약`;

  if (!parsed) {
    fieldsEl.innerHTML = '';
    restEl.textContent = c.memo || '(메모 없음)';
    restEl.classList.remove('hidden');
  } else {
    const f = parsed.fields;
    const rows = ['지역', '소득형태', '소득', '채무금액', '월 예상변제금']
      .filter((k) => f[k])
      .map((k) => `<div class="memo-detail-row"><span class="label">${escapeHTML(k)}</span><span class="value">${escapeHTML(f[k])}</span></div>`)
      .join('');
    fieldsEl.innerHTML = rows;
    if (parsed.rest) {
      restEl.textContent = parsed.rest;
      restEl.classList.remove('hidden');
    } else {
      restEl.textContent = '';
      restEl.classList.add('hidden');
    }
  }
  document.getElementById('memo-modal').classList.remove('hidden');
}

document.getElementById('btn-close-memo').addEventListener('click', () => {
  document.getElementById('memo-modal').classList.add('hidden');
});

/* ---- 고객등급(client_grade): 상담관리의 영업 파이프라인 축. status(사건 진행 단계)와는 완전히
   별개의 개념이라 동시에 존재할 수 있다(예: 수임완료+접수전 → 이후 수임완료+사건진행중). 각 등급의
   정의를 여기 고정해서 직원마다 판단 기준이 어긋나는 일이 없도록 한다. 수정은 관리자만 가능(서버에서도 강제). ---- */
const GRADE_DEFS = {
  '0': { label: '수임완료', desc: '계약 완료', cls: 'g0' },
  '1': { label: '진행임박', desc: '진행 의사가 명확함. 방문/계약/입금 등 구체적 행동이 예정되어 있음 (좁게 적용 — "생각해보고 연락드릴게요"는 진행유보)', cls: 'g1' },
  '2': { label: '진행유력', desc: '가능성 높음. 추가 상담·검토 중', cls: 'g2' },
  '3': { label: '진행유보', desc: '당장 진행하지 않음. 추후 가능성 있음', cls: 'g3' },
  '4': { label: '부재중', desc: '상담 자체가 아직 제대로 이루어지지 않음', cls: 'g4' },
  '5': { label: '드롭', desc: '더 이상 추적하지 않음 (드롭 사유 선택 필요)', cls: 'g5' },
};
const DROP_REASONS = ['연락두절', '비용', '타사선임', '진행의사없음', '자격미달', '시기미정', '기타'];

// 알림톡 마지막 발송일을 "9/1"처럼 짧게 표시. SQLite datetime('now')는 UTC라서 'Z'를 붙여
// 명시적으로 UTC로 해석시킨 뒤 Asia/Seoul로 환산한다 (메모 타임스탬프 KST 버그와 동일한 원인/해법).
function fmtShortKST(sqliteUtcStr) {
  if (!sqliteUtcStr) return '';
  const d = new Date(String(sqliteUtcStr).replace(' ', 'T') + 'Z');
  if (isNaN(d.getTime())) return '';
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' }).formatToParts(d);
  const m = (parts.find((p) => p.type === 'month') || {}).value;
  const day = (parts.find((p) => p.type === 'day') || {}).value;
  return m && day ? `${m}/${day}` : '';
}

function gradeCellHTML(c, isAdmin) {
  const def = c.client_grade ? GRADE_DEFS[c.client_grade] : null;
  const label = def ? `${c.client_grade}.${def.label}` : '미분류';
  const cls = def ? def.cls : 'gnone';
  const alimtalkCount = c.alimtalk_count || 0;
  const lastSent = fmtShortKST(c.alimtalk_last_sent);
  const alimtalkText = alimtalkCount > 0
    ? `알림톡 ${alimtalkCount}회${lastSent ? ' · 마지막 ' + lastSent : ''}`
    : '알림톡 미발송';
  return `
    <div class="grade-pill ${cls} ${isAdmin ? 'editable' : ''}" data-grade-id="${c.id}">${escapeHTML(label)}</div>
    <div class="alimtalk-line">
      <span>${escapeHTML(alimtalkText)}</span>
      <button type="button" class="alimtalk-btn" data-alimtalk-id="${c.id}" title="알림톡 발송 기록 +1">+1</button>
    </div>`;
}

function buildGradeOptionsHTML(selected) {
  const sel = selected || '';
  const items = [{ value: '', label: '미분류', desc: '아직 등급 판단 전' }].concat(
    Object.keys(GRADE_DEFS).map((k) => ({ value: k, label: `${k}. ${GRADE_DEFS[k].label}`, desc: GRADE_DEFS[k].desc }))
  );
  return items.map((it) => `
    <label class="grade-option">
      <input type="radio" name="grade-radio" value="${it.value}" ${sel === it.value ? 'checked' : ''} />
      <span class="grade-option-main"><strong>${escapeHTML(it.label)}</strong><span class="grade-option-desc">${escapeHTML(it.desc)}</span></span>
    </label>`).join('');
}

let gradeModalCase = null;
function openGradeModal(c) {
  gradeModalCase = c;
  document.getElementById('grade-modal-title').textContent = `${c.client_name} 고객등급`;
  document.getElementById('grade-error').textContent = '';
  const optionsEl = document.getElementById('grade-options');
  optionsEl.innerHTML = buildGradeOptionsHTML(c.client_grade || '');
  const dropWrap = document.getElementById('grade-drop-reason-wrap');
  const dropSelect = document.getElementById('grade-drop-reason');
  dropSelect.value = c.client_grade_reason || '';
  dropWrap.classList.toggle('hidden', c.client_grade !== '5');
  optionsEl.querySelectorAll('input[name="grade-radio"]').forEach((r) => {
    r.addEventListener('change', () => {
      dropWrap.classList.toggle('hidden', r.value !== '5');
    });
  });
  document.getElementById('grade-modal').classList.remove('hidden');
}
document.getElementById('btn-close-grade').addEventListener('click', () => {
  document.getElementById('grade-modal').classList.add('hidden');
});
document.getElementById('btn-save-grade').addEventListener('click', async () => {
  const errorEl = document.getElementById('grade-error');
  errorEl.textContent = '';
  if (!gradeModalCase) return;
  const checked = document.querySelector('input[name="grade-radio"]:checked');
  const grade = checked ? checked.value : '';
  const dropReason = document.getElementById('grade-drop-reason').value;
  if (grade === '5' && !dropReason) { errorEl.textContent = '드롭 사유를 선택해야 합니다.'; return; }

  const btn = document.getElementById('btn-save-grade');
  btn.disabled = true;
  try {
    const payload = { client_grade: grade, client_grade_reason: grade === '5' ? dropReason : '' };
    const updated = await api(`/api/cases/${gradeModalCase.id}`, { method: 'PATCH', body: JSON.stringify(payload) });
    const idx = allCases.findIndex((x) => x.id === updated.id);
    if (idx >= 0) allCases[idx] = updated;
    document.getElementById('grade-modal').classList.add('hidden');
    render();
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

function rowHTML(c, isAdmin) {
  const statusLabel = c.status || '미지정';
  const memoText = memoCellHTML(c);
  return `
    <tr class="client-row" data-id="${c.id}">
      <td class="name-cell">${escapeHTML(c.client_name)}</td>
      <td class="muted">${escapeHTML(c.phone || '-')}</td>
      <td class="muted">${escapeHTML(c.assignee_name || '-')}</td>
      <td class="muted">${escapeHTML(c.consult_date || '-')}</td>
      <td><span class="status-pill ${escapeHTML(statusLabel)}">${escapeHTML(statusLabel)}</span></td>
      <td>${gradeCellHTML(c, isAdmin)}</td>
      <td class="memo-cell ${memoText ? '' : 'empty'}" data-memo-id="${c.id}">${memoText}</td>
      <td><button type="button" class="btn-secondary" data-report-edit-id="${c.id}" style="font-size:12px; padding:4px 10px;">✏️ 수정</button></td>
    </tr>`;
}

function render() {
  const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
  const statusFilter = document.getElementById('status-filter').value;
  const gradeFilter = document.getElementById('grade-filter').value;

  let filtered = allCases;
  if (statusFilter === 'active') {
    filtered = filtered.filter((c) => c.status === '상담중' || c.status === '접수전');
  } else if (statusFilter) {
    filtered = filtered.filter((c) => c.status === statusFilter);
  }
  // 등급 필터는 기본값이 "전체"(드롭도 포함)다 — 상태 필터와 마찬가지로 아무것도 숨기지 않는 게
  // 기본이고, 필요할 때만 좁혀서 본다.
  if (gradeFilter === 'none') {
    filtered = filtered.filter((c) => !c.client_grade);
  } else if (gradeFilter) {
    filtered = filtered.filter((c) => c.client_grade === gradeFilter);
  }
  if (q) {
    filtered = filtered.filter((c) => (c.client_name || '').toLowerCase().includes(q));
  }
  // updated_at(최근 변경일) 기준 정렬은 메모/상태 등 아무 필드나 수정될 때마다 그 사건이 목록
  // 맨 위로 튀어올라 "상담일" 표시 순서와 어긋나 보이는(뒤죽박죽) 문제가 있었다. 대신 client_rank -
  // 의뢰인목록(/api/clients)이 이미 쓰고 있는, 한 번 정해지면 어떤 수정에도 흔들리지 않는 고정
  // 정렬키 - 를 그대로 재사용한다(OSMU). client_rank가 없는(드문) 사건은 맨 뒤로 보낸다.
  filtered = filtered.slice().sort((a, b) => {
    const arank = a.client_rank, brank = b.client_rank;
    if (arank == null && brank == null) return b.id - a.id;
    if (arank == null) return 1;
    if (brank == null) return -1;
    return brank - arank;
  });

  document.getElementById('list-count').textContent = `${filtered.length}건`;
  const tbody = document.getElementById('list-tbody');
  const emptyNote = document.getElementById('list-empty');
  if (!filtered.length) {
    tbody.innerHTML = '';
    emptyNote.classList.remove('hidden');
    return;
  }
  emptyNote.classList.add('hidden');
  const isAdmin = !!(currentUser && currentUser.role === 'admin');
  tbody.innerHTML = filtered.map((c) => rowHTML(c, isAdmin)).join('');
  tbody.querySelectorAll('[data-id]').forEach((row) => {
    row.addEventListener('click', () => {
      window.location.href = `/case-detail.html?id=${row.dataset.id}&from=consultations`;
    });
  });
  tbody.querySelectorAll('[data-memo-id]').forEach((cell) => {
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      const c = filtered.find((x) => String(x.id) === cell.dataset.memoId);
      if (c && c.memo) openMemoModal(c);
    });
  });
  // 고객등급 변경은 관리자만: 뷰 자체는 모든 직원에게 보이지만(오늘 누구에게 먼저 전화할지
  // 판단하는 데 필요), 클릭해서 바꾸는 건 관리자 전용이다(서버 PATCH도 동일하게 강제).
  if (isAdmin) {
    tbody.querySelectorAll('[data-grade-id]').forEach((cell) => {
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        const c = filtered.find((x) => String(x.id) === cell.dataset.gradeId);
        if (c) openGradeModal(c);
      });
    });
  }
  tbody.querySelectorAll('[data-alimtalk-id]').forEach((btn) => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      btn.disabled = true;
      try {
        const updated = await api(`/api/cases/${btn.dataset.alimtalkId}/alimtalk-log`, { method: 'POST' });
        const idx = allCases.findIndex((x) => x.id === updated.id);
        if (idx >= 0) allCases[idx] = updated;
        render();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
  });
  // 상담레포트 수정: consult-report.html을 ?edit=<사건ID>로 열면, 그 사건에 저장된 리포트
  // 원본(consult_report_json)을 불러와 수정 모드로 시작한다 (새 상담 등록과 동일하게 새 탭에서).
  tbody.querySelectorAll('[data-report-edit-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.open(`/consult-report.html?edit=${btn.dataset.reportEditId}`, '_blank');
    });
  });
}

document.getElementById('search-input').addEventListener('input', render);
document.getElementById('status-filter').addEventListener('change', render);
document.getElementById('grade-filter').addEventListener('change', render);

/* ---- 새 상담 등록 ---- */

function openNewModal() {
  document.getElementById('nc-error').textContent = '';
  document.getElementById('nc-name').value = '';
  document.getElementById('nc-phone').value = '';
  document.getElementById('nc-defaults-note').textContent =
    `담당직원: ${appSettings.default_assignee_name || '-'} · 담당변호사: ${appSettings.default_lawyer_name || '-'} (설정 페이지에서 변경 가능)`;
  document.getElementById('nc-date').value = todayStr();
  document.getElementById('nc-memo').value = '';
  document.getElementById('new-modal').classList.remove('hidden');
  document.getElementById('nc-name').focus();
}
document.getElementById('btn-new-consultation').addEventListener('click', () => {
  window.open('/consult-report.html', '_blank');
});
document.getElementById('btn-new-consultation-quick').addEventListener('click', openNewModal);
document.getElementById('btn-cancel-new').addEventListener('click', () => {
  document.getElementById('new-modal').classList.add('hidden');
});

/* ---- 상담결과리포트 팝업에서 저장하면 목록을 자동 새로고침 ---- */
async function refreshCaseList() {
  try {
    allCases = await api('/api/cases');
    render();
  } catch { /* 로그인 만료 등은 api()가 자체 처리 */ }
}
window.addEventListener('message', (e) => {
  if (e.origin !== window.location.origin) return;
  if (e.data && e.data.type === 'lawpilot-consult-saved') refreshCaseList();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshCaseList();
});

document.getElementById('btn-save-new').addEventListener('click', async () => {
  const errorEl = document.getElementById('nc-error');
  errorEl.textContent = '';
  const name = document.getElementById('nc-name').value.trim();
  if (!name) { errorEl.textContent = '의뢰인명은 필수입니다.'; return; }
  const date = document.getElementById('nc-date').value;
  if (date && !isValidDateStr(date)) { errorEl.textContent = '상담일은 yyyy-mm-dd 형식으로 입력해주세요.'; return; }

  const payload = {
    client_name: name,
    phone: document.getElementById('nc-phone').value.trim(),
    assignee_name: appSettings.default_assignee_name || '',
    assigned_lawyer: appSettings.default_lawyer_name || '',
    consult_date: date,
    memo: document.getElementById('nc-memo').value.trim(),
    status: '상담중',
  };
  const btn = document.getElementById('btn-save-new');
  btn.disabled = true;
  try {
    const created = await api('/api/cases', { method: 'POST', body: JSON.stringify(payload) });
    window.location.href = `/case-detail.html?id=${created.id}&from=consultations`;
  } catch (err) {
    errorEl.textContent = err.message;
    btn.disabled = false;
  }
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST' });
  window.location.href = '/';
});

async function init() {
  try {
    currentUser = await api('/api/auth/me');
  } catch {
    window.location.href = '/';
    return;
  }
  if (!hasTab(currentUser, 'consultations')) {
    alert('이 페이지에 접근할 권한이 없습니다.');
    window.location.href = '/app.html';
    return;
  }
  document.getElementById('user-name').textContent = `${currentUser.name} 님`;
  if (currentUser.role === 'admin') {
    document.getElementById('nav-settings').style.display = 'inline-block';
  }
  if (!hasTab(currentUser, 'cases')) document.getElementById('nav-cases').style.display = 'none';
  if (!hasTab(currentUser, 'clients')) document.getElementById('nav-clients').style.display = 'none';
  if (hasTab(currentUser, 'fee')) document.getElementById('nav-fee-calendar').style.display = 'inline-block';

  appSettings = await api('/api/settings/defaults').catch(() => appSettings);

  // 2026-08: 상태가 '접수전'/'사건진행중'/'개시결정후'로 바뀌어 의뢰인목록에 나타나도
  // 상담관리 기본 화면에서 사라지면 상담 데이터를 확인할 수 없으므로, 기본값을 "전체"로 두어
  // 상태와 무관하게 모든 상담 데이터가 계속 보이도록 한다 (필요하면 위 필터로 좁혀서 볼 수 있음).
  document.getElementById('status-filter').value = '';
  allCases = await api('/api/cases').catch(() => []);
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}

init();
