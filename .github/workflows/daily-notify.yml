name: Daily Kakao Schedule Notify

on:
  schedule:
    # 매일 08:35(KST) 발송 목표 - KST는 UTC+9라 23:35 UTC로 지정한다.
    # 원래 '0 0 * * *'(자정 UTC = 오전 9시 KST)였는데, 정각(00분)은 전 세계에서 가장 많이
    # 몰리는 GitHub Actions 스케줄 슬롯이라 큐가 밀려 실제로는 3시간 넘게 늦게(점심때) 실행됐다.
    # 정시가 아닌 분(35분)으로 옮겨서 혼잡을 피하고, 목표 시각도 살짝 앞당겨 여유를 둔다.
    - cron: '35 23 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily notify endpoint
        run: |
          curl -sf -X POST "https://team-schedule-app-apd5.onrender.com/api/notify/daily" \
            -H "X-Notify-Key: ${{ secrets.KAKAO_NOTIFY_KEY }}" \
            --max-time 90 --retry 3 --retry-delay 15
