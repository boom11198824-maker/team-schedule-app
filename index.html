<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>팀 스케줄 - 로그인</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#14213d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="팀 스케줄" />
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", Roboto, sans-serif;
  background: #f7f8fa;
  color: #14213d;
}
.login-body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0b1626, #1d3358);
}
.login-card {
  background: white;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.28);
  width: 340px;
  max-width: 100%;
  border-top: 4px solid #ff6452;
}
.login-card h1 { margin: 0 0 4px; font-size: 24px; color: #14213d; }
.login-card .subtitle { color: #8993a6; font-size: 13px; margin-bottom: 24px; }
.login-card label { display: block; font-size: 13px; margin: 12px 0 4px; color: #4b5a78; }
.login-card input {
  width: 100%; padding: 10px 12px; border: 1px solid #d7dce6; border-radius: 8px; font-size: 14px;
}
.login-card button {
  margin-top: 20px; width: 100%; padding: 12px; background: #ff6452; color: white;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
}
.login-card button:hover { background: #e5503f; }
.error-text { color: #d6394a; font-size: 13px; margin-top: 8px; min-height: 16px; }

@media (max-width: 640px) {
  .login-body { height: auto; min-height: 100vh; padding: 20px; }
  .login-card { padding: 28px 24px; width: 100%; }
}
</style>
</head>
<body class="login-body">
  <div class="login-card">
    <h1>📅 팀 스케줄</h1>
    <p class="subtitle">구글 캘린더와 자동 연동되는 직원 일정 관리</p>
    <form id="login-form">
      <label>아이디</label>
      <input type="text" id="username" autocomplete="username" required />
      <label>비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button type="submit">로그인</button>
      <p id="login-error" class="error-text"></p>
    </form>
  </div>

  <script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || '로그인에 실패했습니다.';
      return;
    }
    window.location.href = '/app.html';
  } catch (err) {
    errorEl.textContent = '서버에 연결할 수 없습니다.';
  }
});

fetch('/api/auth/me')
  .then((res) => (res.ok ? (window.location.href = '/app.html') : null))
  .catch(() => {});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
  </script>
</body>
</html>
